version: 2.1

# Mirrors .github/workflows/ci.yml so the two pipelines agree on what "green"
# means. The generated starter config this replaces could not pass here: it ran
# node/install-packages at the repo root (there is no root package.json -- the
# app lives in frontend/), installed Python deps from requirements.txt (the
# lockfile CI installs is requirements.lock, and pytest itself ships in
# requirements-dev.txt), and invoked pytest with no environment, so importing
# src.config raised before collection.

jobs:
  test-python:
    docker:
      - image: cimg/python:3.11
      # GAP-006: same image/user/db as scripts/timescaledb.sh, so
      # tests/test_timescale_storage.py runs instead of skipping ~88 tests.
      - image: timescale/timescaledb:2.17.2-pg17
        environment:
          POSTGRES_USER: tradebot
          POSTGRES_PASSWORD: tradebot-local
          POSTGRES_DB: tradebot
    environment:
      TRADING_MODE: paper
      # Dummy credentials: the suite never reaches an exchange, but src.config
      # fails closed when these are absent.
      BINANCE_API_KEY: dummy
      BINANCE_API_SECRET: dummy
      OKX_API_KEY: dummy
      OKX_API_SECRET: dummy
      OKX_PASSPHRASE: dummy
      LOG_LEVEL: WARNING
      STORAGE_TIMESCALE_DSN: postgresql://tradebot:tradebot-local@127.0.0.1:5432/tradebot
    steps:
      - checkout

      - restore_cache:
          keys:
            - py-{{ checksum "requirements.lock" }}-{{ checksum "requirements-dev.txt" }}

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            # VUL-026: hash-pinned prod install. requirements.lock is compiled
            # from requirements.in only, so dev tools come from the dev file.
            if [ -f requirements.lock ]; then
              pip install --require-hashes -r requirements.lock
            else
              pip install -e ".[dev]"
            fi
            pip install -r requirements-dev.txt

      - save_cache:
          key: py-{{ checksum "requirements.lock" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

      - run:
          name: Wait for TimescaleDB
          command: |
            for i in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -p 5432 -U tradebot && exit 0
              sleep 2
            done
            echo "TimescaleDB did not become ready; Timescale tests will skip."

      - run:
          name: Lint - ruff check
          command: ruff check src/ tests/ --output-format=concise

      - run:
          name: Format check - ruff format
          command: ruff format src/ tests/ --check

      - run:
          name: Run tests
          command: pytest tests/ --tb=short --junitxml=junit.xml

      - store_test_results:
          path: junit.xml

      - store_artifacts:
          path: junit.xml

  build-node:
    docker:
      - image: cimg/node:20.11
    # The dashboard is a subdirectory; there is no package.json at the root.
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project

      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}

      - run:
          name: npm ci
          command: npm ci --prefer-offline

      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Build
          command: npm run build

workflows:
  build-and-test:
    jobs:
      - test-python
      - build-node
