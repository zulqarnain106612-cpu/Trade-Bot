repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: \.vscode/.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: \.env\.example$


  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4  # Debt-006: sync with trunk.yaml + installed version
    hooks:
      - id: bandit
        args: [-r, src/, --severity-level, medium, --confidence-level, medium, -q]
        pass_filenames: false


  - repo: local
    hooks:
      - id: crypto-architect
        name: crypto-architect governance gate
        # Full scan, not per-file: the scoped law checks and the cross-file
        # idempotency/PQC checks only mean anything over the whole tree.
        entry: scripts/arch_gate.sh
        language: script
        pass_filenames: false
        files: ^src/.*\.py$


  - repo: https://github.com/returntocorp/semgrep
    rev: v1.72.0
    hooks:
      - id: semgrep
        name: semgrep custom rules
        args: [--config, .semgrep/rules.yml, --error, --quiet]
        pass_filenames: false
