# Regenerated after the config purge (#144).
# Install with: pre-commit install
#
# Keep the ruff rev in step with the pin in requirements-dev.txt so local
# hooks and CI cannot disagree about what counts as clean.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^frontend/package-lock\.json$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: crypto-architect
        name: crypto-architect governance gate
        # Full scan, not per-file: the scoped law checks and the cross-file
        # idempotency/PQC checks only mean anything over the whole tree.
        entry: scripts/arch_gate.sh
        language: script
        pass_filenames: false
        files: ^src/.*\.py$
