## Aider configuration for Trade-Bot-main
## Auto-generated by AI workspace bootstrap — edit freely

# Model settings
model: claude-sonnet-4-6
weak-model: claude-haiku-4-5-20251001
editor-model: claude-sonnet-4-6

# Context / behaviour
auto-commits: false
dirty-commits: false
attribute-author: false
attribute-committer: false
suggest-shell-commands: true
detect-urls: true
show-diffs: true

# Files / paths
read:
  - .ai/context/project.md
  - .ai/prompts/shared/conventions.md

# Map / indexing
map-tokens: 4096
map-refresh: auto

# Linting (project uses ruff + mypy)
lint-cmd: "uv run ruff check --fix {files}"
auto-lint: true

# Testing
test-cmd: "uv run pytest tests/ -x -q"
auto-test: false

# Git
git: true
gitignore: true
