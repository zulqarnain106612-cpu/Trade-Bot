name: Claude Autonomous Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Never run against fork PRs: this job receives ANTHROPIC_API_KEY and
    # processes untrusted diff content. Fork PRs get no secret and no run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if this exact commit was already reviewed
        id: skip
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          if gh pr view "${{ github.event.pull_request.number }}" --comments \
             | grep -qF "Claude Code Review (commit: ${SHA})"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: anthropics/claude-code-action@v1
        if: steps.skip.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            /code-review --comment
            Prefix your posted comment's first line with exactly:
            "Claude Code Review (commit: ${{ github.event.pull_request.head.sha }})"
          max_turns: 8
          max_budget_usd: "3.00"
