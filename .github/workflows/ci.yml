name: CI

on:
  # The merge queue builds a temporary ref containing this pull request on top
  # of main and every entry queued ahead of it, and runs the required checks
  # against that. Without this trigger those checks never report on the queue
  # ref, the entry waits for a result that cannot arrive, and the queue jams
  # permanently -- which is worse than having no queue at all.
  merge_group:
  push:
    branches: [main]
  # No `paths-ignore` here. `CI gate (all jobs green)` is a required status
  # check, and GitHub reads a required check that never reports as *pending*,
  # not as absent: a docs-only pull request would sit blocked forever with no
  # failing job to point at. tests/test_apply_repo_ruleset.py asserts this.
  pull_request:
    # `ready_for_review` is not one of the default activity types. Without it
    # the queue reveals a parked entry and no run starts: the promotion is
    # real, the checks never report, and the entry sits at the front of the
    # line forever. tests/test_pr_queue.py asserts every gating workflow
    # lists it (REG-0006).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      refresh_durations:
        description: >-
          Re-time the suite and upload durations-shard-* artifacts. Merge them
          into .test_durations and commit when the shard balance has drifted.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is free -- the older run is about stale code. On main
  # it is not: each merge cancelled the previous merge's run, so back-to-back
  # merges left commits with no verdict at all. 60 of main's ~198 runs ended
  # cancelled for exactly that reason, which is why red commits could sit
  # unnoticed. Keep the saving on branches, let main's runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-lint:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Python (lint + governance docs)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Math registry is valid and doc in sync
        run: python3 scripts/generate_math_docs.py --check

      - name: Quality registry is valid and traceability doc in sync
        run: python3 scripts/generate_quality_docs.py --check

      - name: Quality-engineering gates
        # The same gates the skill runs before a push, run again here on the
        # machine that actually decides the pull request. Running them in both
        # places is deliberate: locally they save a round trip, and here they
        # are what makes the contract binding rather than advisory. A step on
        # this job rather than a job of its own, so the gate job's `needs:`
        # set -- and therefore the required-check surface -- is unchanged.
        run: python3 .claude/skills/quality-engineering/scripts/qe_gate.py

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  python-tests:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Python tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Five, not three. Shard-level parallelism is the only kind this suite
        # currently tolerates (see the xdist note on the test step), and each
        # shard is an independent runner, so the way to use more cores is more
        # shards. At three the slowest was 553s of test time; at five the same
        # ~1290s of work lands nearer 260s apiece. The cost is two more runners
        # each paying ~110s of checkout, setup-python and install, which is
        # concurrent with the others and so does not show up in wall clock.
        shard: [1, 2, 3, 4, 5]
        total: [5]

    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: tradebot
          POSTGRES_PASSWORD: tradebot-local
          POSTGRES_DB: tradebot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tradebot -d tradebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      STORAGE_TIMESCALE_DSN: postgresql://tradebot:tradebot-local@127.0.0.1:5433/tradebot
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ matrix.total }}
      # One data file per shard, suffixed so `coverage combine` in the floors
      # job picks all three up. A bare `.coverage` from every shard would
      # collide under `merge-multiple: true` and two thirds of the run would
      # be silently discarded.
      COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (sharded)
        # --cov-fail-under=0 overrides the 99% aggregate in pyproject.toml for
        # this step only. A shard runs a third of the suite and so measures a
        # third of the lines -- 55-65% -- which is not a coverage regression,
        # it is arithmetic. The real 99% gate is enforced once, in
        # python-coverage-floors, against the combined data.
        #
        # -n auto --dist load spreads each shard across every core on its
        # runner, so the two forms of parallelism compose: pytest-split picks
        # which third of the suite this job runs, xdist spreads that third.
        # This is only safe because the suite is order-independent: no test may
        # read state an earlier one left behind, since --dist load assigns
        # tests to workers in no particular order. The one violation of that
        # (parameter_registry, a process-wide singleton that
        # AutoTuningScheduler.start() wrote to and nobody reset) is now
        # snapshotted and restored per test by an autouse fixture in
        # tests/conftest.py. A test that only passes in a particular order is a
        # bug in that test, not a reason to drop these flags.
        run: |
          pytest -q \
            --splits "$SHARD_TOTAL" \
            --group "$SHARD_INDEX" \
            -n auto --dist load \
            --durations=15 \
            --cov-fail-under=0

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          # The data file is dot-prefixed and upload-artifact skips hidden
          # files by default: without this the upload finds nothing and the
          # floors job has no data to combine.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------
      # Refreshing .test_durations.
      #
      # Only on an explicit `workflow_dispatch` with refresh_durations=true,
      # because it re-runs this shard's group a second time purely to time
      # it. The committed file is copied into place first so pytest-split
      # still splits by the *old* timings -- otherwise the refresh run is
      # itself unbalanced and the shard boundaries it measures are not the
      # ones the next run will use.
      #
      # Download the five artifacts and merge them into .test_durations,
      # taking each shard's entries for the tests it actually ran.
      # ---------------------------------------------------------------
      - name: Refresh test durations
        if: inputs.refresh_durations
        env:
          DURATIONS_FILE: .test_durations.shard-${{ matrix.shard }}
        run: |
          cp .test_durations "$DURATIONS_FILE"
          pytest -q \
            --splits "$SHARD_TOTAL" \
            --group "$SHARD_INDEX" \
            --store-durations \
            --durations-path "$DURATIONS_FILE" \
            -p no:cacheprovider \
            --no-cov

      - name: Upload refreshed test durations
        if: inputs.refresh_durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-shard-${{ matrix.shard }}
          path: .test_durations.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  python-coverage-floors:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Python coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install minimal deps for coverage check
        # Minimal now means minimal. This step also installed
        # `-r requirements.txt -r requirements-dev.txt` -- the CUDA-free torch
        # build and the whole runtime tree -- and spent 104s of this job's 154s
        # doing it, for three commands that never import the project: `coverage
        # combine`, `coverage report`, and scripts/check_coverage_floors.py,
        # which is stdlib-only and shells out to the `coverage` CLI.
        #
        # Nothing here reads requirements*.txt any more, so `cache: pip` above
        # went with it: a cache keyed on files this job no longer installs from
        # costs a restore and a save to hold one wheel.
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      # No `|| true` on any of these. A combine or report that fails means the
      # shards produced no usable data, and swallowing that turns the whole
      # coverage gate into a job that cannot fail.
      - name: Combine coverage
        run: coverage combine

      - name: Repo-wide coverage gate
        # fail_under = 99 comes from [tool.coverage.report] in pyproject.toml.
        run: coverage report

      - name: Per-file coverage floors
        run: python scripts/check_coverage_floors.py

  architecture:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Architecture Governance (crypto-architect)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Crypto Architect law gate
        env:
          ARCH_PYTHON: python
        run: scripts/arch_gate.sh --sarif arch.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: arch.sarif
          category: crypto-architect

      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-sarif
          path: arch.sarif
          retention-days: 14

  frontend:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build
        working-directory: frontend
        run: npm run build

  gate:
    name: CI gate (all jobs green)
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (always()) }}
    needs: [python-lint, python-tests, python-coverage-floors, architecture, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py