name: CI — Build · Test · Auto-Fix

on:
  push:
    branches: ["main", "dev", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BACKEND — lint, type-check, pytest + coverage
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    outputs:
      result: ${{ job.status }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint — ruff check
        id: lint
        run: ruff check src/ tests/ --output-format=github

      - name: Format check — ruff format
        id: fmt
        run: ruff format src/ tests/ --check

      - name: Type-check — mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests with coverage
        id: pytest
        env:
          TRADING_MODE: paper
          BINANCE_API_KEY: dummy
          BINANCE_API_SECRET: dummy
          OKX_API_KEY: dummy
          OKX_API_SECRET: dummy
          OKX_PASSPHRASE: dummy
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 2. FRONTEND — install, lint, vite build
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint — ESLint
        working-directory: frontend
        run: npx eslint src/ --max-warnings=0
        continue-on-error: true

      - name: Build — Vite
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 3. AUTO-FIX — runs ONLY when backend or frontend fails
  #    Applies ruff --fix, commits, pushes, re-triggers CI.
  #    Blocks until next CI run result before exiting.
  # ───────────────────────────────────────────────────────────────────────────
  auto-fix:
    name: Auto-Fix & Re-trigger
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Run only on failures caused by human pushes (not by this bot's own commits)
    if: |
      always() &&
      !contains(github.event.head_commit.message, '[auto-fix]') &&
      !contains(github.event.head_commit.message, '[skip-fix]') &&
      (needs.backend.result == 'failure' || needs.frontend.result == 'failure')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install fix tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply ruff auto-fixes
        run: |
          ruff check src/ tests/ --fix --unsafe-fixes || true
          ruff format src/ tests/ || true

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): ruff auto-fix [auto-fix]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Re-trigger CI and wait for result
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"

          # Trigger new workflow run
          curl -s -X POST \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"${REF}\"}"

          echo "Triggered new CI run — waiting 15s for it to register..."
          sleep 15

          # Poll until the latest workflow run on this ref completes
          MAX_POLLS=40
          SLEEP_INTERVAL=30
          for i in $(seq 1 $MAX_POLLS); do
            STATUS=$(curl -s \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?branch=${REF}&per_page=1" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['workflow_runs']; print(r[0]['status'] if r else 'none')")

            CONCLUSION=$(curl -s \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?branch=${REF}&per_page=1" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['workflow_runs']; print(r[0]['conclusion'] if r and r[0]['conclusion'] else 'pending')")

            echo "Poll ${i}/${MAX_POLLS} — status=${STATUS} conclusion=${CONCLUSION}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Re-triggered CI passed."
                exit 0
              else
                echo "❌ Re-triggered CI failed with conclusion: ${CONCLUSION}"
                exit 1
              fi
            fi
            sleep $SLEEP_INTERVAL
          done

          echo "⏰ Timed out waiting for re-triggered CI."
          exit 1

      - name: Fail — no auto-fix available
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "::error title=Auto-Fix Exhausted::ruff found no fixable issues. Manual fix required."
          echo "## ❌ Auto-Fix Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend  | ${{ needs.backend.result }}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frontend | ${{ needs.frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          exit 1
