name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # Optional ML extras are not installed here, so suites that need them
        # are expected to skip rather than fail.
        run: pytest -q

  architecture:
    name: Architecture Governance (crypto-architect)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No dependency install: validate_arch.py is stdlib-only, so this job
      # reports law violations in seconds and never blocks on the lockfile.
      - name: Crypto Architect law gate
        env:
          ARCH_PYTHON: python
        run: scripts/arch_gate.sh --sarif arch.sarif

      - name: Upload SARIF to code scanning
        # Runs even on gate failure so the annotations land on the PR.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: arch.sarif
          category: crypto-architect

      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-sarif
          path: arch.sarif
          retention-days: 14

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
