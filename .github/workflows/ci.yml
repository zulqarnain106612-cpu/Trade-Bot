name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-lint:
    name: Python (lint + governance docs)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Math registry is valid and doc in sync
        run: python3 scripts/generate_math_docs.py --check

      - name: Quality registry is valid and traceability doc in sync
        run: python3 scripts/generate_quality_docs.py --check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  python-tests:
    name: Python tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]

    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: tradebot
          POSTGRES_PASSWORD: tradebot-local
          POSTGRES_DB: tradebot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tradebot -d tradebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      STORAGE_TIMESCALE_DSN: postgresql://tradebot:tradebot-local@127.0.0.1:5433/tradebot
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ matrix.total }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0"
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-split

      - name: Run tests (sharded)
        run: |
          pytest -q \
            --splits "$SHARD_TOTAL" \
            --group "$SHARD_INDEX" \
            --store-durations \
            --durations-path .test_durations

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            .coverage
            .test_durations
          retention-days: 7

  python-coverage-floors:
    name: Python coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install minimal deps for coverage check
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Download coverage shards
        uses: actions/download-artifact@95815c38f0d25f7d5d6d7d3b6f5e31fb5f5a6c94 # v6.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          coverage combine || true
          coverage xml || true

      - name: Per-file coverage floors
        run: python scripts/check_coverage_floors.py

  architecture:
    name: Architecture Governance (crypto-architect)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Crypto Architect law gate
        env:
          ARCH_PYTHON: python
        run: scripts/arch_gate.sh --sarif arch.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: arch.sarif
          category: crypto-architect

      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-sarif
          path: arch.sarif
          retention-days: 14

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build
        working-directory: frontend
        run: npm run build

  gate:
    name: CI gate (all jobs green)
    runs-on: ubuntu-latest
    if: always()
    needs: [python-lint, python-tests, python-coverage-floors, architecture, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py