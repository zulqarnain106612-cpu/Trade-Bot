name: CI

on:
  push:
    branches: ["main", "dev", "feature/**", "fix/**", "feat/**", "chore/**", "ci/**", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR pushes cancel their predecessor. A manual `workflow_dispatch` must
  # not cancel the run already queued for the same ref -- on a single-executor
  # self-hosted runner the jobs serialise, so cancel-in-progress would kill the
  # still-queued Backend (pytest) job and leave an empty-log phantom failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}

    # GAP-006: mirrors scripts/timescaledb.sh (same image/user/db/port) so
    # tests/test_timescale_storage.py runs instead of skipping ~88 tests,
    # which otherwise drags total coverage under the 95% fail-under gate.
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: tradebot
          POSTGRES_PASSWORD: tradebot-local
          POSTGRES_DB: tradebot
        # Ephemeral host port, not a fixed 5433. Self-hosted runners share one
        # host, so two Backend jobs running concurrently would collide on any
        # fixed mapping ("bind: address already in use"). The assigned port is
        # read back via job.services.timescaledb.ports below.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tradebot -d tradebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Requirements drift check
        # A package declared only in requirements.txt is never installed: the
        # lock CI installs is compiled from requirements.in alone. duckdb sat
        # in that state and every DuckDBStore test failed on ModuleNotFoundError.
        # Runs before install so drift fails fast, on stdlib only.
        run: python scripts/check_requirements_sync.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # VUL-026: Install from lockfile with hash verification if present.
          # Generate with: pip-compile --generate-hashes requirements.in > requirements.lock
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          else
            pip install -e ".[dev]"
            echo "WARNING: requirements.lock not found — install is unhashed. Run pip-compile --generate-hashes to create it."
          fi
          # requirements.lock is compiled from requirements.in (prod deps only);
          # dev tools (detect-secrets, ruff, mypy, pytest-cov) live in
          # requirements-dev.txt and are installed unhashed on top.
          pip install -r requirements-dev.txt

      - name: Secret scanning — fail on unaudited baseline entries
        # VUL-019: All entries in .secrets.baseline must be audited (is_verified != null).
        # Run: detect-secrets audit .secrets.baseline  to review each finding.
        run: |
          detect-secrets scan --baseline .secrets.baseline
          python - <<'EOF'
          import json, sys
          baseline = json.load(open(".secrets.baseline"))
          unaudited = [
              f"{f}:{s['line_number']}"
              for f, secrets in baseline.get("results", {}).items()
              for s in secrets
              if s.get("is_verified") is None
          ]
          if unaudited:
              print("FAIL: Unaudited secret findings in .secrets.baseline:")
              print("\n".join(f"  {u}" for u in unaudited))
              print("Run: detect-secrets audit .secrets.baseline")
              sys.exit(1)
          print(f"OK: {sum(len(v) for v in baseline.get('results',{}).values())} finding(s) all audited.")
          EOF

      - name: Lint - ruff check
        id: lint
        run: ruff check src/ tests/ --output-format=github

      - name: Format check - ruff format
        id: fmt
        run: ruff format src/ tests/ --check

      - name: Type check - mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests with coverage
        id: pytest
        env:
          TRADING_MODE: paper
          STORAGE_TIMESCALE_DSN: postgresql://tradebot:tradebot-local@127.0.0.1:${{ job.services.timescaledb.ports['5432'] }}/tradebot  # pragma: allowlist secret
          BINANCE_API_KEY: dummy
          BINANCE_API_SECRET: dummy
          OKX_API_KEY: dummy
          OKX_API_SECRET: dummy
          OKX_PASSPHRASE: dummy
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Per-file coverage floors (Risk-004 / GAP-020)
        run: python3 scripts/check_coverage_floors.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint - ESLint
        working-directory: frontend
        run: npx eslint src/ --max-warnings=0
        continue-on-error: true

      - name: Build - Vite
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

# REMOVED 2026-08-16 by owner request: the `auto-fix` job committed and pushed
# ruff rewrites back onto any branch using the broad GH_TOKEN, then
# re-dispatched CI and polled it for up to 20 minutes. Two unattended writes to
# a live-trading repo plus a self-retriggering CI loop. Lint is report-only now;
# fixes are applied by a human.

