name: Security

# Regenerated after the config purge. The pre-purge tree gated every PR on
# Bandit, pip-audit, npm audit, TruffleHog and Semgrep; the purge deleted those
# workflows and the config-set regeneration rebuilt only ci.yml and codeql.yml,
# so secret scanning and dependency CVE scanning silently stopped running.
#
# Semgrep is deliberately not reinstated here: its rulesets are fetched from
# the semgrep.dev registry at scan time, which makes the job fail closed on a
# registry outage. CodeQL (codeql.yml) already provides semantic SAST for
# python, javascript and javascript-typescript, so the coverage is not lost.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories land against code that has not changed, so a scan
    # that only runs on push would go stale on a quiet week.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit

      - name: Scan
        # -ll fails on MEDIUM severity and above. The tree currently reports 30
        # LOW findings and zero at MEDIUM+, so this gate is meaningful rather
        # than pre-broken: it blocks a real regression without needing a
        # baseline file that everyone learns to regenerate.
        run: bandit -q -r src kg rag_mongo orchestrator common tools review -ll

  pip-audit:
    name: pip-audit (Python CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Audit dev dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off

      # requirements-optional.txt is not audited. pip-audit resolves a manifest
      # by dry-run installing it, and the optional extras pull the full CUDA
      # torch/transformers stack -- minutes of download for packages that no
      # CI job installs. The two manifests above are exactly what ci.yml
      # installs, so they are what can actually reach a runner.

  npm-audit:
    name: npm audit (frontend CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build an auditable copy of the dependency tree
        working-directory: frontend
        # The audit endpoint rejects this project's lockfile outright:
        #
        #   400 Bad Request - Invalid package tree, run npm install to
        #   rebuild your package-lock.json
        #
        # The lockfile is not malformed and rebuilding it changes nothing.
        # @tailwindcss/oxide-wasm32-wasi declares bundleDependencies, so its
        # six children are marked inBundle and carry no `resolved` or
        # `integrity` -- they ship inside the parent tarball, which is how npm
        # records a bundled dependency. The endpoint cannot resolve them and
        # rejects the whole request rather than skipping them.
        #
        # --omit=optional would clear the error and is the wrong fix: it drops
        # 106 packages, 12 of which do install on linux-x64 (sharp's libvips
        # binaries, rolldown, lightningcss, tailwind's oxide). Losing CVE
        # coverage on code that actually ships is worse than the bug.
        #
        # So the bundled subtree is removed from a *copy* and everything else
        # is audited as before. wasm32 is not an install target here, so
        # nothing that ships loses coverage.
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cp package.json package-lock.json "$RUNNER_TEMP/audit/"
          node - "$RUNNER_TEMP/audit/package-lock.json" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const lock = JSON.parse(fs.readFileSync(path, "utf8"));

          const bundlers = Object.entries(lock.packages).filter(
            ([, meta]) => meta.bundleDependencies
          );

          // Guard, not decoration: a future dependency that bundles children
          // would hit the same 400, and silently dropping it would shrink the
          // scan without anyone noticing. Anything unexpected fails here.
          const unexpected = bundlers.filter(
            ([name, meta]) =>
              name !== "node_modules/@tailwindcss/oxide-wasm32-wasi" || !meta.optional
          );
          if (unexpected.length) {
            console.error(
              "::error::unexpected bundleDependencies, review before auditing: " +
                unexpected.map(([n]) => n).join(", ")
            );
            process.exit(1);
          }

          const before = Object.keys(lock.packages).length;
          for (const [name] of bundlers) {
            for (const key of Object.keys(lock.packages)) {
              if (key === name || key.startsWith(name + "/")) {
                delete lock.packages[key];
              }
            }
          }
          const removed = before - Object.keys(lock.packages).length;
          console.log(`removed ${removed} bundled entries; ${Object.keys(lock.packages).length} remain auditable`);

          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + "\n");
          NODE

      - name: Audit
        working-directory: ${{ runner.temp }}/audit
        # --audit-level=high blocks high and critical only. Moderate advisories
        # in a build-time-only dependency tree are noise that would train
        # everyone to ignore this job.
        #
        # `npm audit` exits 1 for three unrelated things, and this job used to
        # report all of them as if the frontend had vulnerabilities:
        #
        #   1. high/critical advisories found -> a real verdict, must fail
        #   2. 5xx from registry.npmjs.org    -> transient, worth retrying
        #   3. a rejected tree                -> no scan ran, so passing
        #                                        would be a lie
        #
        # npm writes "audit endpoint returned an error" for (2) and (3) and
        # nothing like it for (1), which is what separates a verdict from a
        # non-scan.
        run: |
          for attempt in 1 2 3; do
            # `| tee` would make the pipeline status tee's own 0, so the
            # audit result has to be read before anything else runs.
            set +e
            npm audit --audit-level=high > audit.log 2>&1
            status=$?
            set -e
            cat audit.log

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q "audit endpoint returned an error" audit.log; then
              echo "::error::npm audit reported high or critical advisories."
              exit 1
            fi

            if grep -q "Invalid package tree" audit.log; then
              echo "::error::The audit endpoint rejected the tree even after the bundled subtree was removed, so no CVE scan ran. See the comment on the previous step."
              exit 1
            fi

            echo "npm audit attempt ${attempt}: registry unreachable, retrying."
            sleep $((attempt * 15))
          done

          echo "::error::npm audit could not reach the registry after 3 attempts."
          exit 1

  secrets:
    name: TruffleHog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install TruffleHog
        # Pinned rather than floating: a scanner that silently changes its
        # detector set between runs turns a red build into a mystery.
        env:
          TRUFFLEHOG_VERSION: 3.90.10
        run: |
          curl -sSfL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            -o trufflehog.tar.gz
          tar xzf trufflehog.tar.gz trufflehog
          ./trufflehog --version

      - name: Scan
        # --only-verified: report a credential only when it authenticates
        # against its provider. Unverified matches are overwhelmingly high-
        # entropy strings that are not secrets, and a gate that cries wolf gets
        # switched off. A filesystem scan of the checkout is used rather than a
        # base..head diff so the job cannot pass by scanning an empty range.
        run: ./trufflehog filesystem . --only-verified --no-update --fail
