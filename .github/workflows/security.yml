name: Security

# Regenerated after the config purge. The pre-purge tree gated every PR on
# Bandit, pip-audit, npm audit, TruffleHog and Semgrep; the purge deleted those
# workflows and the config-set regeneration rebuilt only ci.yml and codeql.yml,
# so secret scanning and dependency CVE scanning silently stopped running.
#
# Semgrep is deliberately not reinstated here: its rulesets are fetched from
# the semgrep.dev registry at scan time, which makes the job fail closed on a
# registry outage. CodeQL (codeql.yml) already provides semantic SAST for
# python, javascript and javascript-typescript, so the coverage is not lost.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories land against code that has not changed, so a scan
    # that only runs on push would go stale on a quiet week.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit

      - name: Scan
        # -ll fails on MEDIUM severity and above. The tree currently reports 30
        # LOW findings and zero at MEDIUM+, so this gate is meaningful rather
        # than pre-broken: it blocks a real regression without needing a
        # baseline file that everyone learns to regenerate.
        run: bandit -q -r src kg rag_mongo orchestrator common tools review -ll

  pip-audit:
    name: pip-audit (Python CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Audit dev dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off

      # requirements-optional.txt is not audited. pip-audit resolves a manifest
      # by dry-run installing it, and the optional extras pull the full CUDA
      # torch/transformers stack -- minutes of download for packages that no
      # CI job installs. The two manifests above are exactly what ci.yml
      # installs, so they are what can actually reach a runner.

  npm-audit:
    name: npm audit (frontend CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build an auditable copy of the dependency tree
        working-directory: frontend
        # The audit endpoint rejects this project's lockfile outright:
        #
        #   400 Bad Request - Invalid package tree, run npm install to
        #   rebuild your package-lock.json
        #
        # The lockfile is not malformed and rebuilding it changes nothing.
        # @tailwindcss/oxide-wasm32-wasi declares bundleDependencies, so its
        # six children are marked inBundle and carry no `resolved` or
        # `integrity` -- they ship inside the parent tarball, which is how npm
        # records a bundled dependency. The endpoint cannot resolve them.
        #
        # Two things this went through first, so nobody repeats them:
        #   * `npm ci` before auditing does not help. npm derives the audit
        #     tree from the lockfile whether or not node_modules exists.
        #   * --omit=optional clears the error and drops 106 packages, 12 of
        #     which do install on linux-x64 (sharp's libvips binaries,
        #     rolldown, lightningcss, tailwind's oxide). Losing CVE coverage
        #     on code that ships is worse than the bug.
        #
        # So the bundled subtree is removed from a *copy* -- and, critically,
        # so is the reference to it in @tailwindcss/oxide's
        # optionalDependencies. Removing the packages while leaving the edge
        # pointing at them is what made an earlier attempt at this pass once
        # and then fail: npm resolves the edge, finds nothing, and calls the
        # tree invalid.
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cp package.json package-lock.json "$RUNNER_TEMP/audit/"
          node - "$RUNNER_TEMP/audit/package-lock.json" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const lock = JSON.parse(fs.readFileSync(path, "utf8"));

          const bundlers = Object.entries(lock.packages).filter(
            ([, meta]) => meta.bundleDependencies
          );

          // Guard, not decoration: a future dependency that bundles children
          // would hit the same 400, and silently dropping it would shrink the
          // scan without anyone noticing. Anything unexpected fails here.
          const unexpected = bundlers.filter(
            ([name, meta]) =>
              name !== "node_modules/@tailwindcss/oxide-wasm32-wasi" || !meta.optional
          );
          if (unexpected.length) {
            console.error(
              "::error::unexpected bundleDependencies, review before auditing: " +
                unexpected.map(([n]) => n).join(", ")
            );
            process.exit(1);
          }

          const before = Object.keys(lock.packages).length;
          // Only the bundler's own name. Its bundled children are nested
          // inside it and were never resolvable from anywhere else, so no
          // surviving edge points at them -- while their bare names (tslib,
          // @emnapi/runtime) are also ordinary top-level packages that
          // eleven other dependencies legitimately depend on. Pruning by
          // child name severed those.
          const removedNames = new Set(
            bundlers.map(([name]) => name.replace(/^node_modules\//, ""))
          );
          for (const [name] of bundlers) {
            for (const key of Object.keys(lock.packages)) {
              if (key === name || key.startsWith(name + "/")) {
                delete lock.packages[key];
              }
            }
          }

          // Prune edges pointing at what was just removed. Leaving them is
          // what makes npm call the tree invalid.
          let prunedEdges = 0;
          const EDGE_FIELDS = [
            "dependencies",
            "optionalDependencies",
            "peerDependencies",
            "devDependencies",
          ];
          for (const meta of Object.values(lock.packages)) {
            for (const field of EDGE_FIELDS) {
              const edges = meta[field];
              if (!edges) continue;
              for (const dep of Object.keys(edges)) {
                if (removedNames.has(dep)) {
                  delete edges[dep];
                  prunedEdges++;
                }
              }
              if (Object.keys(edges).length === 0) delete meta[field];
            }
          }

          const remaining = Object.keys(lock.packages).length;
          console.log(
            `removed ${before - remaining} bundled entries and ${prunedEdges} dangling edges; ` +
              `${remaining} remain auditable`
          );

          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + "\n");
          NODE

      - name: Audit
        working-directory: ${{ runner.temp }}/audit
        # --audit-level=high blocks high and critical only. Moderate advisories
        # in a build-time-only dependency tree are noise that would train
        # everyone to ignore this job.
        #
        # `npm audit` exits 1 for three unrelated things, and this job used to
        # report all of them as if the frontend had vulnerabilities:
        #
        #   1. high/critical advisories found -> a real verdict, must fail
        #   2. registry unreachable           -> retried, then a warning:
        #                                        a finding fails this job,
        #                                        being unable to ask does not
        #   3. a rejected tree                -> no scan ran, so passing
        #                                        would be a lie
        #
        # npm writes "audit endpoint returned an error" for (2) and (3) and
        # nothing like it for (1), which is what separates a verdict from a
        # non-scan.
        #
        # Each attempt is bounded, and two of them rather than three. The
        # audit endpoint is being retired and has been slow all day: a
        # successful call takes seconds, a struggling one has taken up to six
        # minutes, and unbounded attempts held every PR in the queue for
        # twenty. 300s is comfortably above the observed success latency and
        # caps the job at ten minutes.
        run: |
          for attempt in 1 2; do
            # `| tee` would make the pipeline status tee's own 0, so the
            # audit result has to be read before anything else runs.
            set +e
            timeout 300 npm audit --audit-level=high > audit.log 2>&1
            status=$?
            set -e
            cat audit.log

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -eq 124 ]; then
              echo "npm audit attempt ${attempt}: timed out after 300s, retrying."
              sleep $((attempt * 15))
              continue
            fi

            if ! grep -q "audit endpoint returned an error" audit.log; then
              echo "::error::npm audit reported high or critical advisories."
              exit 1
            fi

            if grep -q "Invalid package tree" audit.log; then
              echo "::error::The audit endpoint rejected the tree even after the bundled subtree and its dangling edges were removed, so no CVE scan ran. See the comment on the previous step."
              exit 1
            fi

            echo "npm audit attempt ${attempt}: registry unreachable, retrying."
            sleep $((attempt * 15))
          done

          # Warning, not error. A finding fails this job; being unable to ask
          # does not. The endpoint npm uses here is being retired and has
          # been alternately instant, 503, and hanging past 300s within the
          # same hour -- failing every PR in the repository on that is the
          # exact "fails closed on someone else's registry outage" problem
          # this file's header gives as the reason Semgrep is not reinstated.
          #
          # This is not a coverage gap: .github/dependabot.yml watches
          # /frontend for npm advisories independently of this job and opens
          # PRs for them, so an outage here delays a duplicate check rather
          # than removing the only one.
          echo "::warning::npm audit could not reach the registry after 2 attempts -- no CVE scan ran this time. Dependabot still watches /frontend independently."

  secrets:
    name: TruffleHog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TruffleHog
        # Pinned rather than floating: a scanner that silently changes its
        # detector set between runs turns a red build into a mystery.
        env:
          TRUFFLEHOG_VERSION: 3.90.10
        run: |
          curl -sSfL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            -o trufflehog.tar.gz
          tar xzf trufflehog.tar.gz trufflehog
          ./trufflehog --version

      - name: Scan
        # --only-verified: report a credential only when it authenticates
        # against its provider. Unverified matches are overwhelmingly high-
        # entropy strings that are not secrets, and a gate that cries wolf gets
        # switched off. A filesystem scan of the checkout is used rather than a
        # base..head diff so the job cannot pass by scanning an empty range.
        run: ./trufflehog filesystem . --only-verified --no-update --fail
