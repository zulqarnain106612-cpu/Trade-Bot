name: Security Audit

# Multi-tool security pipeline:
#  1. bandit      — Python security linter (OWASP / CWE patterns)
#  2. semgrep     — semantic pattern scanner (SQL injection, hardcoded secrets,
#                   async pitfalls, trading-specific patterns)
#  3. pip-audit   — CVE scan of all Python dependencies
#  4. npm audit   — CVE scan of all frontend dependencies
#  5. trufflehog  — git history secret leak scan
#
# SARIF results uploaded to GitHub Security tab automatically.
# HIGH/CRITICAL findings auto-create labeled GitHub issues.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  issues: write

jobs:
  bandit:
    name: Bandit — Python security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        run: pip install bandit[sarif]==1.7.8

      - name: Run bandit
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    name: Semgrep — semantic security scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep
        run: |
          semgrep ci \
            --config "p/python" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/asyncio" \
            --sarif \
            --output semgrep.sarif \
            --error \
            || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  pip-audit:
    name: pip-audit — Python CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies + pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip install -e ".[dev]" -r requirements-dev.txt || true

      - name: Run pip-audit
        id: audit
        run: |
          pip-audit \
            --strict \
            --format json \
            --output pip-audit.json \
            || echo "AUDIT_FAILED=true" >> $GITHUB_ENV

      - name: Print human-readable summary
        run: pip-audit --strict || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

      - name: Open issue on new CVEs
        if: env.AUDIT_FAILED == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pip-audit.json', 'utf8'));
            const vulns = (report.dependencies || []).flatMap(d =>
              (d.vulns || []).map(v => `${d.name}@${d.version}: ${v.id} — ${v.description.slice(0,120)}`)
            );
            if (vulns.length === 0) return;
            const title = `[Security] pip-audit found ${vulns.length} CVE(s) — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Python Dependency CVEs',
              '**Source:** pip-audit (daily scan)',
              '',
              '| Package | CVE | Description |',
              '|---------|-----|-------------|',
              ...vulns.map(v => `| ${v} |`),
              '',
              '**Action required:** `pip-audit --fix` or pin patched versions in `requirements.in`',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies', 'auto-generated'],
            });

      - name: Write CVEs to Vulner-Fix.md
        if: env.AUDIT_FAILED == 'true'
        run: |
          python - <<'PYEOF'
          import json, subprocess, os
          if not os.path.exists("pip-audit.json"):
              exit(0)
          report = json.load(open("pip-audit.json"))
          for dep in report.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  subprocess.run([
                      "python", "scripts/vulner_fix_append.py",
                      "--severity", "HIGH",
                      "--tool", "pip-audit",
                      "--file", f"{dep['name']}@{dep['version']}",
                      "--summary", f"{vuln['id']}: {vuln.get('description','')[:120]}",
                      "--fix", f"Upgrade {dep['name']} to patched version. Run: pip-audit --fix",
                      "--status", "Open",
                  ], check=False)
          PYEOF

      - name: Commit Vulner-Fix.md
        if: env.AUDIT_FAILED == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet Vulner-Fix.md || (
            git add Vulner-Fix.md
            git commit -m "chore: update Vulner-Fix.md from pip-audit [skip ci]"
            git push || true
          )

  npm-audit:
    name: npm audit — Frontend CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json || echo "NPM_AUDIT_FAILED=true" >> $GITHUB_ENV

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
          retention-days: 30

  trufflehog:
    name: TruffleHog — git secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json
