name: Dependency Security Audit

on:
  schedule:
    # Every Monday 07:00 UTC
    - cron: "0 7 * * 1"
  push:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Python — resolve the dep graph without downloading wheels, then audit.
  # Cold-runner time: ~25s instead of 10-15 minutes.
  # ─────────────────────────────────────────────────────────────────────────
  audit-python:
    name: Python — pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit (only tool needed)
        # The full project stack is NOT installed here.
        # pip-audit resolves the dependency graph via the PyPI JSON API
        # without downloading any wheels, keeping this step fast.
        run: python -m pip install --upgrade pip pip-audit

      - name: Resolve dependency list (no wheel downloads)
        # pip install --dry-run --report writes a JSON manifest of what
        # *would* be installed without actually downloading anything.
        # Requires pip >= 22.2 (ubuntu-latest ships pip 24+).
        shell: bash
        run: |
          pip install \
            --dry-run \
            --ignore-installed \
            --report resolved.json \
            -e ".[dev]" \
            --quiet 2>/dev/null || true

          # Extract name==version pairs for pip-audit
          python3 - <<'PY'
          import json
          with open("resolved.json") as f:
              data = json.load(f)
          pkgs = [
              f"{p['metadata']['name']}=={p['metadata']['version']}"
              for p in data.get("install", [])
          ]
          with open("requirements-resolved.txt", "w") as f:
              f.write("\n".join(pkgs))
          print(f"Resolved {len(pkgs)} packages")
          PY

      - name: Audit resolved packages
        shell: bash
        run: |
          pip-audit \
            --strict \
            --requirement requirements-resolved.txt \
            --output json \
            --format json \
            > pip-audit.json || AUDIT_EXIT=$?

          # Also emit human-readable to the log
          pip-audit \
            --strict \
            --requirement requirements-resolved.txt \
            || exit ${AUDIT_EXIT:-0}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: |
            pip-audit.json
            requirements-resolved.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — npm audit (fast, uses lock file)
  # ─────────────────────────────────────────────────────────────────────────
  audit-frontend:
    name: Frontend — npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
