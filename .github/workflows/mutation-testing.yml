name: Mutation Testing (sharded)

# Manual-only. Mutation testing (cosmic-ray) checks whether the test suite
# would actually catch a small bug at a given line — not just whether the
# line ran (that's what coverage % measures). cosmic-ray 2.5.1 has no
# built-in way to split one module's mutants across parallel runners, so
# this workflow does it manually: one job builds the full mutant list
# (`cosmic-ray init`), a matrix of jobs each claims a deterministic slice
# of it (scripts/mutation_shard_runner.py) and runs on its own disposable
# runner, and a final job merges all the slices into one report
# (scripts/mutation_aggregate.py). See docs/ROADMAP_NEXT_STEPS_20260712.md
# P4.11 and the mutmut-incompatible memory note for why cosmic-ray (not
# mutmut) and why sharded (not cosmic-ray's built-in `local`/`http`
# distributors).
#
# Safety note: cosmic-ray mutates the real checked-out source file in
# place per-mutant, runs the tests, then reverts. If a runner is
# cancelled mid-mutation the revert never happens — but each matrix job
# runs on a disposable, ephemeral GitHub-hosted VM that is destroyed
# after the job regardless of outcome, and this workflow never commits
# or pushes anything, so a corrupted mutation dies with the runner. This
# is NOT safe to do against a persistent local checkout without a
# git-diff-clean-or-restore check after every interruption (see the
# mutmut-incompatible memory note for the incident that motivated this).

on:
  workflow_dispatch:
    inputs:
      module_path:
        description: "Python module to mutate, e.g. src/risk/kelly.py"
        required: true
        type: string
      test_files:
        description: "Space-separated test files to run per mutant, e.g. tests/test_kelly.py tests/test_kelly_gaps.py"
        required: true
        type: string
      shard_count:
        description: "Number of parallel matrix shards"
        required: false
        type: number
        default: 8
      per_mutant_timeout_seconds:
        description: "Timeout for each individual mutant's test run"
        required: false
        type: number
        default: 30
  push:
    paths:
      - '.github/mutation-trigger.json'

env:
  PYTHON_VERSION: "3.11"
  COSMIC_RAY_VERSION: "2.5.1" # 3.x is broken for this repo — see mutmut-incompatible memory note

jobs:
  prepare:
    name: Build mutant list
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.matrix.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve inputs (workflow_dispatch inputs or .github/mutation-trigger.json for push)
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 - <<'PY' >> $GITHUB_ENV
import json
j=json.load(open('.github/mutation-trigger.json'))
print(f"MODULE_PATH={j['module_path']}")
print(f"TEST_FILES={j['test_files']}")
print(f"SHARD_COUNT={j['shard_count']}")
print(f"PER_MUTANT_TIMEOUT_SECONDS={j['per_mutant_timeout_seconds']}")
PY
          else
            echo "MODULE_PATH=${{ inputs.module_path }}" >> $GITHUB_ENV
            echo "TEST_FILES=${{ inputs.test_files }}" >> $GITHUB_ENV
            echo "SHARD_COUNT=${{ inputs.shard_count }}" >> $GITHUB_ENV
            echo "PER_MUTANT_TIMEOUT_SECONDS=${{ inputs.per_mutant_timeout_seconds }}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.lock pins numpy==2.5.0 (needs Python>=3.12) and is
          # broken against this workflow's Python 3.11 — same issue found in
          # ci.yml's primary install path during local investigation, tracked
          # separately. Use the version-range requirements.txt instead.
          pip install -r requirements.txt -r requirements-dev.txt -e .
          pip install "cosmic-ray==${{ env.COSMIC_RAY_VERSION }}"

      - name: Generate cosmic-ray config
        run: |
          cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "${{ env.MODULE_PATH }}"
          timeout = ${{ env.PER_MUTANT_TIMEOUT_SECONDS }}
          excluded-modules = []
          test-command = "python -m pytest -x -q -p no:cacheprovider --no-cov ${{ env.TEST_FILES }}"

          [cosmic-ray.distributor]
          name = "local"
          EOF
          cat cosmic-ray.toml

      - name: cosmic-ray init (builds the full mutant list, does not run any tests)
        run: cosmic-ray init cosmic-ray.toml session.sqlite

      - name: Compute shard matrix
        id: matrix
        run: |
          python3 -c "
          import json
          n = int('${{ env.SHARD_COUNT }}')
          print('shard_matrix=' + json.dumps(list(range(n))))
          " >> "$GITHUB_OUTPUT"

      - name: Upload session + config
        uses: actions/upload-artifact@v4
        with:
          name: mutation-session
          path: |
            cosmic-ray.toml
            session.sqlite
          retention-days: 3

  mutate:
    name: Shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.lock pins numpy==2.5.0 (needs Python>=3.12) and is
          # broken against this workflow's Python 3.11 — same issue found in
          # ci.yml's primary install path during local investigation, tracked
          # separately. Use the version-range requirements.txt instead.
          pip install -r requirements.txt -r requirements-dev.txt -e .
          pip install "cosmic-ray==${{ env.COSMIC_RAY_VERSION }}"

      - uses: actions/download-artifact@v4
        with:
          name: mutation-session

      - name: Run shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: |
          python scripts/mutation_shard_runner.py \
            cosmic-ray.toml session.sqlite \
            ${{ matrix.shard }} ${{ env.SHARD_COUNT }}

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: session.sqlite
          retention-days: 3

  aggregate:
    name: Aggregate results
    needs: [prepare, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cosmic-ray==${{ env.COSMIC_RAY_VERSION }}"

      - uses: actions/download-artifact@v4
        with:
          name: mutation-session
          path: master

      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Merge shards and report
        run: |
          shard_dbs=$(find shards -name session.sqlite)
          python scripts/mutation_aggregate.py master/session.sqlite $shard_dbs | tee mutation-report.txt
          {
            echo "## Mutation testing report — ${{ env.MODULE_PATH }}"
            echo '```'
            cat mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 14
