name: PR queue

# A strictly serial merge pipeline.
#
# GitHub's own merge queue was the obvious candidate and is the wrong shape:
# when an entry fails it is dequeued and the *next* entry starts immediately,
# so a failing pull request is set aside rather than finished. This queue does
# the opposite. Exactly one pull request is active at a time; it stays the only
# active one while it is red; and nothing else runs a single job until it
# merges.
#
# The mechanics:
#   - A parked pull request is a draft carrying the `queued` label. Draft means
#     it cannot merge, and every gating workflow skips its jobs on a draft, so
#     a parked entry spends no runner minutes at all.
#   - Promotion updates the branch from main *first*, then marks the pull
#     request ready. The order matters: neither call raises a workflow run
#     when it is made with the built-in GITHUB_TOKEN, so promotion runs under
#     `secrets.GH_TOKEN`; `ready_for_review` is then a real event and CI runs
#     against the already-updated head. Without that secret the entry is
#     promoted but nothing starts it -- see REG-0006.
#   - Only labelled drafts are promoted. A draft someone made by hand is a
#     work in progress and is left alone.

on:
  push:
    branches: [main]
  # The trigger that actually fires.
  #
  # A queue entry's checks finishing is exactly the moment the queue needs to
  # act, and it is an event that really happens: the controller promotes an
  # entry, its CI runs, CI completes, this wakes. Merging then promotes the
  # next entry, whose CI completes, which wakes this again -- the loop is
  # driven by real work rather than by a clock.
  workflow_run:
    workflows:
      - "CI"
      - "CodeQL"
      - "Workflow lint"
      - "Security"
    types: [completed]

  # A human merging or closing an entry frees the queue too.
  pull_request_target:
    types: [opened, reopened, closed]

  # Kept as a backstop, not relied on. GitHub throttles and drops
  # high-frequency schedules: this workflow was set to */5 and did not fire
  # once in the hour that followed, while the repository's nightly schedule
  # ran normally. A queue whose only heartbeat is cron is a queue that stops.
  #
  # A push made with GITHUB_TOKEN does not trigger workflows. The controller
  # arms auto-merge with that token, so the merge it produces raises no push
  # event and this workflow is never woken by the thing it is waiting for.
  # Observed directly: #248 was armed by a human token, its merge triggered a
  # run and #258 was promoted; #258 was armed by the controller, and its merge
  # triggered nothing at all.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Least privilege at the top, so a job added later starts read-only and has to
# ask. Only `reconcile` writes anything, and it says what for.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Serial by construction: two copies of this racing could promote two
  # entries and put two pull requests in flight at once.
  group: pr-queue
  cancel-in-progress: false

jobs:
  reconcile:
    # `contents: write` is for pulls.updateBranch, which merges the base into
    # the entry's branch -- a write to the branch, not to this repository's
    # default branch. `pull-requests: write` parks, promotes, labels and
    # comments. The gate job below needs neither and does not get them.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Park every extra entry, promote the front one
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          # GitHub raises no workflow run for *any* event produced with the
          # built-in GITHUB_TOKEN -- not just pushes. Promotion done with it
          # marks the entry ready and starts nothing, so the front of the
          # queue sits with no run and no way to get one, and somebody has to
          # push an empty commit by hand. A separate credential is what makes
          # `ready_for_review` a real event. Falls back to GITHUB_TOKEN so a
          # repository without the secret still parks correctly; only
          # promotion is degraded. REG-0006.
          #
          # A fork reaches this workflow through pull_request_target, which
          # runs with the base repository's secrets. Such an entry only ever
          # needs parking, and GITHUB_TOKEN parks perfectly well, so the
          # elevated token is withheld from it (SUP-003).
          github-token: ${{ (!github.event.pull_request.head.repo.fork && secrets.GH_TOKEN) || secrets.GITHUB_TOKEN }}
          script: |
            const LABEL = 'queued';

            const all = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            // First opened is first served.
            all.sort((a, b) => a.number - b.number);

            const labelled = pr => (pr.labels || []).some(l => l.name === LABEL);

            // Active = open, not a draft. A red pull request is still active,
            // which is the whole point: it holds the line until it is fixed.
            let active = all.filter(pr => !pr.draft);
            // Parked = a draft we parked. A hand-made draft has no label and
            // is not ours to touch.
            const parked = all.filter(pr => pr.draft && labelled(pr));

            const ensureLabel = async (number) => {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: number, labels: [LABEL],
              }).catch(e => core.warning(`label ${number}: ${e.message}`));
            };

            // A pull request is parked through GraphQL; the REST API cannot
            // convert a ready pull request back to a draft.
            const park = async (pr) => {
              await github.graphql(
                `mutation($id: ID!) {
                   convertPullRequestToDraft(input: {pullRequestId: $id}) {
                     pullRequest { number }
                   }
                 }`,
                { id: pr.node_id },
              );
              await ensureLabel(pr.number);
              core.info(`parked #${pr.number}`);
            };

            // Keep only the oldest active entry; park the rest.
            const front = active[0];
            for (const pr of active.slice(1)) {
              await park(pr);
            }

            if (front) {
              // An active entry with no check runs at all is stalled, not
              // working. Retargeting a pull request's base fires none of
              // opened/synchronize/reopened, so no workflow triggers and the
              // entry sits at the front with zero checks -- blocked, with
              // nothing failed and nothing to notify. Nudge it back to life
              // by closing and reopening, which does fire an event.
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: front.head.sha, per_page: 100,
              });
              // A run produced while the entry was parked concluded `skipped`
              // for every job -- the draft guard saw to that. It is a run,
              // and it verifies nothing. Counting it is how #279 defeated
              // this recovery: the head had four skipped runs from before
              // promotion, so the entry looked checked and the nudge stood
              // down. In-progress runs carry a null conclusion and still
              // count, which is what keeps the nudge from firing twice.
              const ours = runs.data.workflow_runs.filter(
                r => r.event === 'pull_request' && r.conclusion !== 'skipped'
              );
              if (ours.length === 0) {
                core.warning(`#${front.number} has no checks; reopening to trigger them.`);
                await github.rest.pulls.update({
                  ...context.repo, pull_number: front.number, state: 'closed',
                });
                await github.rest.pulls.update({
                  ...context.repo, pull_number: front.number, state: 'open',
                });
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: front.number,
                  body: [
                    '### Queue: no checks had started on this pull request',
                    '',
                    'It was at the front of the queue with zero check runs, which',
                    'blocks a merge without anything having failed. Reopened to',
                    'trigger the workflows.',
                  ].join('\n'),
                });
                return;
              }

              // An active entry can be out of date: it was active before the
              // queue existed, or main moved under it. Promotion is what
              // normally updates a branch, and promotion has already happened
              // for this one, so nothing would ever bring it forward and the
              // ruleset's up-to-date requirement blocks it indefinitely.
              const detail = await github.rest.pulls.get({
                ...context.repo, pull_number: front.number,
              });
              if (detail.data.mergeable_state === 'behind') {
                try {
                  await github.rest.pulls.updateBranch({
                    ...context.repo, pull_number: front.number,
                  });
                  core.info(`updated #${front.number} from main`);
                } catch (error) {
                  core.warning(`#${front.number} could not be updated: ${error.message}`);
                }
              }

              // Merge it here rather than waiting to be told it is green.
              // Auto-merge stays armed as well, but it cannot be depended on
              // to advance the queue: the merge it performs is attributed to
              // the token that armed it, and a GITHUB_TOKEN merge wakes
              // nothing. Doing it in-pass means one run both finishes an
              // entry and starts the next, with no event in between.
              if (detail.data.mergeable_state === 'clean') {
                try {
                  await github.rest.pulls.merge({
                    ...context.repo, pull_number: front.number, merge_method: 'squash',
                  });
                  core.info(`merged #${front.number}`);
                  active = [];
                } catch (error) {
                  core.warning(`#${front.number} could not be merged: ${error.message}`);
                }
              }

              if (active.length > 0) {
                core.info(`#${front.number} holds the line; nothing is promoted.`);
                core.summary.addRaw(`Active: #${front.number}. Parked: ${parked.length}.`);
                await core.summary.write();
                return;
              }
            }

            const next = parked[0];
            if (!next) {
              core.info('Queue is empty.');
              return;
            }

            // Update first, then reveal. The push triggers nothing either
            // way, so the run that matters is the one `ready_for_review`
            // starts against the already-updated head -- which only happens
            // because this step runs under a token that is not GITHUB_TOKEN.
            try {
              await github.rest.pulls.updateBranch({
                ...context.repo, pull_number: next.number,
              });
              core.info(`updated #${next.number} from main`);
            } catch (error) {
              // A conflict cannot be resolved from here, and promoting into
              // one would put an unmergeable entry at the front forever.
              // Say so on the pull request and leave it parked.
              await github.rest.issues.createComment({
                ...context.repo, issue_number: next.number,
                body: [
                  '### Queue: cannot update this branch',
                  '',
                  `\`${error.message}\``,
                  '',
                  'This is usually a merge conflict with `main`. Resolve it and',
                  'push; the queue will pick this pull request up on its next pass.',
                ].join('\n'),
              });
              core.warning(`#${next.number} could not be updated: ${error.message}`);
              return;
            }

            await github.graphql(
              `mutation($id: ID!) {
                 markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                   pullRequest { number }
                 }
               }`,
              { id: next.node_id },
            );
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: next.number, name: LABEL,
            }).catch(() => {});

            // Armed here rather than at open time: auto-merge cannot be set on
            // a draft, so the entry is armed at the moment it goes active.
            await github.graphql(
              `mutation($id: ID!) {
                 enablePullRequestAutoMerge(
                   input: {pullRequestId: $id, mergeMethod: SQUASH}
                 ) { pullRequest { number } }
               }`,
              { id: next.node_id },
            ).catch(e => core.warning(`auto-merge #${next.number}: ${e.message}`));

            core.info(`promoted #${next.number}`);
            core.summary.addRaw(`Promoted #${next.number}.`);
            await core.summary.write();

  gate:
    # The controller obeys the same law it enforces: a broken queue must be
    # visible as a red check, not as a queue that quietly stopped moving.
    needs: [reconcile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Checks out the base repository, which is what `pull_request_target`
      # gives by default. The entry's own code is never fetched under this
      # workflow's write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
      - name: Assert every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py
