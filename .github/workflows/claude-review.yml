name: Claude Cloud Review (RAG + Knowledge Graph retrieval)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege at the top: retrieve-context only reads the repository. The
# write scopes this workflow needs to post a review are granted on the one job
# that posts it, rather than to every job in the file.
permissions:
  contents: read

concurrency:
  # Keyed on the PR, not the ref, and superseding is the point: pushing three
  # times to a PR queued three full reviews, each of which read the diff it was
  # started for and posted its own comment. Only the review of the current head
  # is worth paying for or reading.
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retrieve-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A pull request from a fork gets no access to secrets, so MONGODB_URI
    # would be empty and the retrieval would fail on connection rather than on
    # anything about the code. Skip the whole workflow there instead of
    # reporting infrastructure noise as a review.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install retrieval dependencies
        run: pip install -r requirements.txt
      - name: Build retrieval context (vector + full-text + hybrid + graph)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m review.build_context \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out context.json
      - uses: actions/upload-artifact@v7
        with:
          name: review-context
          path: context.json
          # Without this the step warns and passes when build_context wrote
          # nothing, and the review job then downloads an empty artifact and
          # reviews the diff ungrounded -- the one thing this workflow exists
          # to avoid -- with no signal that it happened.
          if-no-files-found: error
          # Retrieval context for a single PR review. It is superseded by the
          # next push and has no value once the PR is merged.
          retention-days: 7

  claude-review:
    needs: retrieve-context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Posting the review comment.
      pull-requests: write
      issues: write
      # OIDC for anthropics/claude-code-action.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: review-context
      - name: Claude Code review (Pro/Max subscription -- no API key)
        # Advisory only, per docs/CLOUD_REVIEW.md: a human makes the final
        # call, so this must not gate a merge. It had been blocking one --
        # on a large diff the reviewer runs out of turns and the step fails
        # for an infrastructure reason that says nothing about the code.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff. context.json in the working
            directory holds related documents and facts retrieved from this
            project's MongoDB Atlas RAG + knowledge graph store -- use it to
            ground the review in prior decisions and related code, not just
            the diff in isolation.

            Flag correctness issues, security issues, and inconsistencies
            with the conventions documented in CLAUDE.md.

            This is advisory only: do not approve or merge. A human reviewer
            makes the final call -- human-in-the-loop, adapted from the
            fraud-review pattern in Anthropic's CMA_with_mongodb_atlas
            cookbook.

            Post your findings as a single summary comment via
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
            (or as inline comments on specific lines via the inline-comment
            tool where that's clearer). Do not just return the review as your
            final text response -- it must be posted to the PR.
          claude_args: |
            # 40 was not enough to read a large diff and still post the
            # comment: the run ended in error_max_turns having written
            # nothing to the PR.
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
