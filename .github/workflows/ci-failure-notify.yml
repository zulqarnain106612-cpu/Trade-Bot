# Registry: GOV-013, GOV-020 (config/quality_registry.json).
name: CI failure notice

# Why this exists: CI logs, job records, annotations, artifacts and check
# results are permanently unreadable from an agent session -- see
# `ci_log_access` in config/command_policy.json, enforced by the PreToolUse
# hook and by shell_exec.run(). This workflow is the *only* channel through
# which a failure reaches anyone, so it has to be complete on its own.
#
# Three rules follow from being the only channel, and all three are load-bearing:
#
#   1. ONE mutable comment per PR head. A non-green job cancels all
#      in-flight watched workflow runs, including its own run if sibling jobs
#      are still executing, and publishes one actionable check. The success
#      phrase appears only after every watched workflow has completed green.
#
#   2. Status and exact errors, nothing else. No advice, no instructions, no
#      "consider checking" prose. The comment is read into an agent's context,
#      and every line that is not the status or the failing assertion is spend
#      with no information in it.
#
#   3. The EXACT failing lines, not the step name and not the runner's exit
#      code. "Process completed with exit code 1" is what the previous version
#      surfaced, and it says nothing -- so exit-code noise is filtered out and
#      the real assertion text is preferred, from annotations first and the job
#      log second. The log is read here, server-side, where it costs nothing:
#      that is precisely what makes fetching it from a session unnecessary.
#
# It reports every outcome that is not green. "Not green" is the whole set:
# failure, cancelled, timed_out, neutral, action_required, stale -- and a job
# that reports `skipped`, because a skipped required check satisfies branch
# protection without having verified anything, which is how #292 merged with
# all four gates unrun.

on:
  workflow_run:
    workflows:
      - "CI"
      - "CodeQL"
      - "Workflow lint"
      - "Security"
    # Start the watcher when a workflow begins, not only after it completes.
    # The watcher polls individual job conclusions and cancels sibling runs as
    # soon as a non-green job is visible; completed events consolidate verdicts.
    types: [in_progress, completed]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Keep workflow lifecycle events separate from the PR-head watcher. A new
  # commit cancels the stale PR watcher; workflow-run events never cancel the
  # active watcher or each other while they are collecting verdicts.
  group: ci-notice-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.ref }}-${{ github.event_name == 'workflow_run' && 'workflow-run' || 'pull-request' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notify:
    if: github.event_name == 'workflow_run' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    # All workflow_run activity types are inspected. A workflow can conclude
    # success while a required job inside it was skipped or neutral.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # Required to cancel sibling workflow runs when a check is non-green.
      checks: read
      pull-requests: write
    steps:
      - name: Poll CI and post the first non-green check for this PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const event = context.payload;
            const trigger = event.workflow_run || {
              head_sha: event.pull_request.head.sha,
              head_branch: event.pull_request.head.ref,
              id: null,
              pull_requests: [{ number: event.pull_request.number }],
            };
            // For pull_request runs, head_sha can identify GitHub's synthetic
            // merge commit. Bind notices to the PR branch HEAD instead.
            const triggerPR = event.pull_request ||
              (trigger.pull_requests || []).find(pr => pr.head && pr.head.sha);
            let headSha = (triggerPR && triggerPR.head && triggerPR.head.sha) ||
              trigger.head_sha;

            // Workflows that must have reported before a verdict is posted.
            // Kept identical to the `on.workflow_run.workflows` list above;
            // tests/test_ci_failure_notify_workflow.py asserts they match, so
            // adding a workflow to one without the other cannot make the
            // notice announce "all green" while a workflow is still running.
            const WATCHED = [
              'CI',
              'CodeQL',
              'Workflow lint',
              'Security',
            ];

            // ---- which pull request -------------------------------------
            // workflow_run.pull_requests is empty for push-triggered runs,
            // which is the normal case here. Resolve the triggering commit
            // directly instead of using issue search on a bare SHA; the latter
            // can return nothing because the search index may not associate
            // the SHA with its pull request yet.
            let prNumbers = (trigger.pull_requests || []).map(pr => pr.number);
            if (prNumbers.length === 0 && trigger.head_sha) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: trigger.head_sha,
                per_page: 100,
              });
              prNumbers = associated.data
                .filter(pr => pr.state === 'open')
                .map(pr => pr.number);
            }
            if (prNumbers.length === 0 && trigger.head_branch) {
              const byBranch = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                head: context.repo.owner + ':' + trigger.head_branch,
                per_page: 100,
              });
              prNumbers = byBranch.data.map(pr => pr.number);
            }
            if (prNumbers.length === 0) {
              core.info('No pull request for ' + headSha + '; nothing to notify.');
              return;
            }

            // Resolve the current PR head before polling. A workflow_run may
            // identify GitHub's synthetic merge SHA, so its SHA must not be
            // compared directly with the branch head or used as the notice key.
            let currentHead = null;
            for (const number of prNumbers) {
              const candidate = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (candidate.data.state !== 'open') continue;
              if (trigger.head_branch && candidate.data.head.ref !== trigger.head_branch) continue;
              currentHead = candidate.data;
              headSha = candidate.data.head.sha;
              break;
            }
            if (!currentHead) {
              core.info('No open PR matches this workflow event; nothing to notify.');
              return;
            }

            // The pull_request watcher polls live job state for prompt failure
            // detection. Completion-event runs consolidate the final verdict.
            // These event classes have separate concurrency groups, so routine
            // workflow lifecycle events cannot cancel the live watcher.
            const isBad = (j) => j.conclusion !== 'success';

            const NOISE = [
              /^Process completed with exit code \d+\.?$/i,
              /^The (job|operation) was canceled/i,
              /^Error: Process completed/i,
              /^##\[error\]Process completed with exit code/i,
              // A run replaced by a newer commit on the same ref, and the
              // upload step that then finds nothing to upload. Both describe
              // the cancellation, not a defect in the commit.
              /^Canceling since a higher priority waiting request/i,
              /^No files were found with the provided path:/i,
            ];
            const isNoise = (line) => NOISE.some(re => re.test(line));

            // Lines that carry a real failure. Ordered most-specific first so
            // a pytest summary line beats a bare traceback frame.
            const SIGNAL = [
              // REG-0023: an xdist worker that dies takes the short summary
              // with it -- the run ends with no FAILED line at all, so every
              // pattern below missed and the fallback printed the worker's
              // last stdout ("Event loop is closed") with no test named. The
              // crash lines are the only place the node id survives, so they
              // rank above the summary line: when both exist the crash is
              // the one a reader has to see first.
              /crashed while running/,              // xdist: names the node id
              /^\[gw\d+\] node down/,              // xdist: worker died
              /^replacing crashed worker/,           // xdist: and was replaced
              /^INTERNALERROR>/,                     // pytest itself broke
              /^!+ .*Interrupted/,                   // session aborted
              /^FAILED\s+\S+/,                      // pytest short summary
              /^ERROR\s+\S+/,                       // pytest collection error
              /^E\s{2,}\S/,                         // pytest assertion detail
              /^\s*\w*(Error|Exception):\s*\S/,     // raised exception
              /^AssertionError\b/,
              /^\s*assert\s+\S/,
              /^\[FAIL\]/,                          // this project's own gates
              /^##\[error\]/,
              /^Error:\s*\S/,
              /^error(\[\w+\])?:\s*\S/,             // ruff / cargo style
            ];

            const MAX_MSG_LINES = 8;

            // REG-0020: a tool whose failure matches no SIGNAL -- pip-audit's
            // vulnerability table is the case that surfaced it -- left the
            // notice with the step name and no error at all. The tool's own
            // last lines are the error: the output of the failing step sits
            // between the runner's `##[endgroup]` (end of the echoed command
            // and env) and its closing `##[error]` exit-code line. Table
            // rules and runner markers are not error text and are dropped.
            const RULE = /^[-=+|\s]+$/;
            function stepOutputTail(raw) {
              let end = -1;
              for (let i = raw.length - 1; i >= 0; i--) {
                if (/^##\[error\]/.test(raw[i])) { end = i; break; }
              }
              if (end < 0) return [];
              let start = 0;
              for (let i = end - 1; i >= 0; i--) {
                if (/^##\[endgroup\]/.test(raw[i])) { start = i + 1; break; }
              }
              return raw.slice(start, end)
                .filter(l => !/^##\[/.test(l) && !RULE.test(l) && !isNoise(l))
                .slice(-MAX_MSG_LINES);
            }

            async function messagesFor(job) {
              // Annotations first: GitHub already extracted the assertion
              // text, and it is one cheap call.
              try {
                const ann = await github.rest.checks.listAnnotations({
                  ...context.repo, check_run_id: job.id, per_page: 20,
                });
                // Location first. A bare message names the exception and not
                // the test that raised it, and "Event loop is closed" with no
                // file is a notice that cannot be acted on without the log
                // this workflow exists to avoid reading.
                const msgs = ann.data
                  .filter(a => a.annotation_level !== 'notice')
                  .map(a => {
                    const first = (a.message || a.title || '')
                      .split('\n').map(s => s.trim()).filter(Boolean)[0];
                    if (!first) return '';
                    const where = a.path && a.path !== '.github'
                      ? `${a.path}${a.start_line ? ':' + a.start_line : ''}: `
                      : '';
                    const title = a.title && a.title.trim() && !first.includes(a.title.trim())
                      ? `${a.title.trim()} -- `
                      : '';
                    return `${where}${title}${first}`;
                  })
                  .filter(Boolean)
                  .filter(l => !isNoise(l));
                if (msgs.length) return msgs.slice(0, MAX_MSG_LINES);
              } catch (e) {
                core.info(`annotations unavailable for ${job.name}: ${e.message}`);
              }
              // Then the job log, read here and never republished whole.
              try {
                const log = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  ...context.repo, job_id: job.id,
                });
                const text = typeof log.data === 'string'
                  ? log.data
                  : Buffer.from(log.data).toString('utf8');
                const raw = text
                  .split('\n')
                  .map(l => l.replace(/^\S*\d{2}:\d{2}:\d{2}\.?\d*Z?\s*/, '').trim())
                  .filter(Boolean);
                const lines = raw.filter(l => !isNoise(l));
                const pathish = lines.filter(l =>
                  /^(?:(?:src|tests|common|scripts|frontend)\/\S+|\S+\.py\s+\d+\s+\d+\s+\d+\s+\d+%)/.test(l)
                  || /Would reformat:|would be reformatted/.test(l)
                );
                if (pathish.length && /lint|format|coverage/i.test(job.name)) {
                  const selected = [...new Set(pathish)].slice(-MAX_MSG_LINES);
                  if (selected.length) return selected;
                }
                if (/lint/i.test(job.name)) {
                  const diagnostics = [];
                  for (let i = 0; i < raw.length; i++) {
                    const match = raw[i].match(/^([A-Z]\d{3,4})\s+(.*)$/);
                    if (!match) continue;
                    const location = raw.slice(i + 1, i + 5)
                      .map(line => line.match(/^-->\s+(.+)$/))
                      .find(Boolean);
                    diagnostics.push((location ? location[1] + " — " : "") +
                      match[1] + " " + match[2]);
                  }
                  if (diagnostics.length) {
                    const count = raw.find(line => /^Found \d+ errors?\.?$/.test(line));
                    return [...diagnostics.slice(0, count ? MAX_MSG_LINES - 1 : MAX_MSG_LINES),
                      ...(count ? [count] : [])];
                  }
                }
                // Prefer the output bounded to the actual failing step. Earlier
                // advisory gates can print "[FAIL]" while exiting successfully;
                // scanning the entire job first can mislabel that as the cause
                // of a later lint/test failure.
                const failingStepOutput = stepOutputTail(raw);
                if (failingStepOutput.length) return failingStepOutput;
                for (const re of SIGNAL) {
                  const hits = lines.filter(l => re.test(l));
                  // Fallback only when the runner did not expose a bounded step tail.
                  if (hits.length) return hits.slice(-MAX_MSG_LINES);
                }
                return stepOutputTail(raw);
              } catch (e) {
                core.info(`log unavailable for ${job.name}: ${e.message}`);
                return [];
              }
            }

            let latest = new Map();
            let pending = [];
            let failing = [];
            const severity = {
              failure: 0, timed_out: 1, neutral: 2, action_required: 3,
              stale: 4, skipped: 5, cancelled: 6,
            };
            const isSummaryGate = (job) => /gate|all jobs green/i.test(job.name);
            // An in_progress event is an early-stop watcher for its own run.
            // Do not infer this commit's verdict from older same-SHA runs of
            // sibling workflows that have not started their current run yet.
            const earlyFailureOnly = event.workflow_run && event.action === 'in_progress';

            for (let poll = 0; poll < 90; poll++) {
              if (earlyFailureOnly) {
                const triggerRunResponse = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: trigger.id,
                });
                const triggerRun = triggerRunResponse.data;
                const triggerJobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { ...context.repo, run_id: trigger.id, per_page: 100 },
                );
                failing = triggerJobs
                  .filter(job => job.conclusion || triggerRun.status === 'completed')
                  .filter(job => isBad(job))
                  .map(job => ({ workflow: triggerRun.name, run_id: triggerRun.id, job }));
                if (failing.length > 0) {
                  // Cancel sibling workflows after any non-green job is visible,
                  // but keep this triggering run alive so its failure remains visible.
                  const allRuns = await github.paginate(
                    github.rest.actions.listWorkflowRunsForRepo,
                    { ...context.repo, branch: currentHead.head.ref, per_page: 100 },
                  );
                  pending = allRuns.filter(r => {
                    if (r.id === triggerRun.id) return false;
                    if (!WATCHED.includes(r.name) || r.status === 'completed') return false;
                    const linked = (r.pull_requests || []).some(pr =>
                      prNumbers.includes(pr.number) && pr.head && pr.head.sha === headSha);
                    return linked || (r.head_branch === currentHead.head.ref && r.head_sha === headSha);
                  });
                  break;
                }
                // A green completion is consolidated by its separate completed
                // event. This early watcher has no success verdict to publish.
                if (triggerRun.status === 'completed') return;
                if (poll < 89) await new Promise(resolve => setTimeout(resolve, 10000));
                continue;
              }

              // Pull-request workflow runs may use GitHub's synthetic merge
              // SHA as head_sha. Query by branch, then bind runs to this exact
              // PR head through their associated pull-request head SHA.
              const allRuns = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { ...context.repo, branch: currentHead.head.ref, per_page: 100 },
              );
              latest = new Map();
              for (const r of allRuns) {
                if (!WATCHED.includes(r.name)) continue;
                const linkedToCurrentHead = (r.pull_requests || []).some(pr =>
                  prNumbers.includes(pr.number) && pr.head && pr.head.sha === headSha);
                const exactCommitRun = r.head_branch === currentHead.head.ref && r.head_sha === headSha;
                if (!linkedToCurrentHead && !exactCommitRun) continue;
                const prior = latest.get(r.name);
                if (!prior || r.run_number > prior.run_number ||
                    (r.run_number === prior.run_number && r.run_attempt > prior.run_attempt)) {
                  latest.set(r.name, r);
                }
              }
              pending = [...latest.values()].filter(r => r.status !== 'completed');
              failing = [];
              for (const run of latest.values()) {
                const jobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { ...context.repo, run_id: run.id, per_page: 100 },
                );
                for (const job of jobs) {
                  // A completed job with skipped/neutral/no conclusion is
                  // non-green even while other jobs in its workflow continue.
                  if (!job.conclusion && run.status !== 'completed') continue;
                  if (isBad(job)) failing.push({ workflow: run.name, run_id: run.id, job });
                }
              }

              if (failing.length > 0) break;
              if (pending.length === 0 && latest.size >= WATCHED.length) break;
              if (poll < 89) await new Promise(resolve => setTimeout(resolve, 10000));
            }

            failing.sort((a, b) =>
              (severity[a.job.conclusion] ?? 99) - (severity[b.job.conclusion] ?? 99) ||
              Number(isSummaryGate(a.job)) - Number(isSummaryGate(b.job)) ||
              Number(b.run_id === trigger.id) - Number(a.run_id === trigger.id));
            const actionable = failing;
            if (actionable.length > 0) {
              for (const run of pending) {
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    ...context.repo, run_id: run.id,
                  });
                } catch (e) {
                  core.warning('Could not cancel ' + run.name + ': ' + e.message);
                }
              }
              failing.splice(0, failing.length, actionable[0]);
            } else if (pending.length > 0 || latest.size < WATCHED.length) {
              const missing = WATCHED.filter(name => !latest.has(name));
              core.info('Waiting for all watched workflows to finish. Pending: ' +
                pending.map(r => r.name).join(', ') + '; not yet observed: ' + missing.join(', '));
              return;
            }

            // ---- build a single-check notice -----------------------------
            const marker = '<!-- ci-notice -->';
            const shaMarker = '<!-- ci-notice-sha:' + headSha + ' -->';
            const body = [marker, shaMarker];
            const selected = failing[0] || null;
            if (!selected) {
              body.push('workflow Succeeded');
            } else {
              const workflow = selected.workflow;
              const job = selected.job;
              const step = (job.steps || []).find(
                s => s.conclusion && s.conclusion !== 'success' && s.conclusion !== 'skipped');
              const where = step ? ' · ' + step.name : '';
              body.push('**' + workflow + ' / ' + job.name + '** — ' +
                (job.conclusion || 'no verdict') + where);
              const msgs = ['skipped', 'neutral', 'cancelled'].includes(job.conclusion)
                ? [] : await messagesFor(job);
              if (msgs.length) {
                body.push(String.fromCharCode(96).repeat(3));
                for (const m of msgs) body.push(m.slice(0, 300));
                body.push(String.fromCharCode(96).repeat(3));
              }
            }
            // Rule 2 ends the comment here. No footer, no advice, no links to
            // a log nobody is allowed to open.
            const text = body.join('\n');

            for (const number of prNumbers) {
              const currentPr = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (currentPr.data.state !== 'open' || currentPr.data.head.sha !== headSha) {
                core.info('Ignoring stale CI notice for a superseded or closed PR head.');
                continue;
              }
              // One comment, edited in place. A PR that fails five times
              // carries one current comment, not five stale ones.
              const existing = await github.paginate(
                github.rest.issues.listComments,
                { ...context.repo, issue_number: number, per_page: 100 },
              );
              const notices = existing.filter(c =>
                c.user && c.user.login === 'github-actions[bot]' &&
                c.body && c.body.includes(marker));
              notices.sort((a, b) =>
                (b.updated_at || '').localeCompare(a.updated_at || ''));
              const prior = notices[0];
              if (prior) {
                if (prior.body.trim() !== text.trim()) {
                  await github.rest.issues.updateComment({
                    ...context.repo, comment_id: prior.id, body: text,
                  });
                }
              } else {
                // Posted on green too, not only on failure: this comment is
                // the only channel, so "nothing here" has to be sayable. It
                // is one comment either way.
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: number, body: text,
                });
              }
            }

# This workflow is a notifier, not a required status check. The merged-comment
# job only replaces the same bot-owned notice after the pull request is merged.

  gate:
    name: PR notice gate
    if: always()
    needs: [notify, merged-comment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Require notifier jobs to finish correctly
        env:
          NEEDS: ${{ toJSON(needs) }}
          # On open/synchronize, merged-comment is expected to skip; on close,
          # notify is expected to skip because the merge handler owns that event.
          ALLOW_SKIPPED: notify,merged-comment
        run: python3 scripts/assert_jobs_green.py

  merged-comment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Replace the CI notice with the merge outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.payload.pull_request.number;
            const marker = '<!-- ci-notice -->';
            const shaMarker = '<!-- ci-notice-sha:' + context.payload.pull_request.head.sha + ' -->';
            const body = [marker, shaMarker, 'merged'].join('\n');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: number, per_page: 100 },
            );
            const notices = comments.filter(c =>
              c.user && c.user.login === 'github-actions[bot]' &&
              c.body && c.body.includes(marker));
            notices.sort((a, b) =>
              (b.updated_at || '').localeCompare(a.updated_at || ''));
            const prior = notices[0];
            if (prior) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: number, body,
              });
            }
