name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "27 4 * * 1"

# Required for uploading results / creating code scanning alerts
permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (language=${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Use one entry per run. 'javascript-typescript' covers JS and TS.
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No `fetch-depth: 0`. CodeQL extracts the checked-out tree; it does
        # not read history, and the full clone is pure latency on a repo this
        # size. The action's own docs ask for a full fetch only for the
        # `--diff-range` PR-only analysis mode, which this workflow does not
        # use -- it analyses the whole tree every run, on purpose.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Both languages here are interpreted: CodeQL builds their databases
          # by reading source, never by watching a compiler. `none` is the
          # supported way to say so, and it is what removes the four steps
          # that used to sit between init and analyse.
          #
          # Those steps cost 144s of a 292s job installing requirements.txt so
          # that "CodeQL extractors can see dependencies" -- which the Python
          # extractor does not do. It resolves imports against the source tree
          # and its own bundled library models; an installed site-packages
          # changes nothing it reports. The Node half was worse: `npm ci ||
          # npm install --legacy-peer-deps || true` re-did work the frontend
          # job in ci.yml already does, and swallowed its own failure, so it
          # could only ever cost time or lie.
          #
          # The autobuild fallback went with them. With build-mode: none there
          # is nothing to fall back to, and a no-op step that is documented as
          # "safe" is how a real build failure becomes invisible.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # A human-readable category shown in the Code Scanning UI
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------
  # All-green gate.
  #
  # Branch protection requires checks by name, so a job that never runs --
  # skipped by an `if:`, or never reached because an earlier job failed --
  # satisfies a required check by being absent. This job depends on every
  # other job here and fails unless each one reported success, so "all
  # green" becomes a single check that cannot be satisfied by absence.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped
  # the moment any dependency fails, and a skipped gate blocks nothing.
  # ---------------------------------------------------------------------
  gate:
    name: CodeQL gate (all jobs green)
    runs-on: ubuntu-latest
    if: always()
    needs: [analyze]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py
