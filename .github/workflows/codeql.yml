name: CodeQL Security Analysis

# GitHub CodeQL — free, automatic vulnerability detection
# Scans for: SQL injection, path traversal, XSS, command injection,
#            uncontrolled format strings, hardcoded credentials, and 80+ CWEs.
# Results appear in: Security → Code scanning alerts
# Auto-creates issues for new HIGH/CRITICAL findings.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality,security-extended
          config: |
            paths:
              - src
              - frontend/src
            paths-ignore:
              - frontend/node_modules
              - .venv
            query-filters:
              - exclude:
                  problem.severity: recommendation

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # Auto-create GitHub issues for new critical findings
  create-issues:
    name: Create issues for critical findings
    needs: analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      security-events: read

    steps:
      - uses: actions/checkout@v4

      - name: Fetch code scanning alerts
        id: alerts
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/{owner}/{repo}/code-scanning/alerts
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          state: open
          severity: critical,high
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issues for new critical alerts
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = JSON.parse(process.env.ALERTS_JSON || '[]');
            for (const alert of alerts.slice(0, 5)) {
              const title = `[Security] ${alert.rule.description} (${alert.rule.id})`;
              const body = [
                `## CodeQL Security Finding`,
                `**Severity:** ${alert.rule.severity}`,
                `**Rule:** ${alert.rule.id} — ${alert.rule.description}`,
                `**Location:** \`${alert.most_recent_instance.location.path}:${alert.most_recent_instance.location.start_line}\``,
                `**Message:** ${alert.most_recent_instance.message.text}`,
                ``,
                `[View in Security tab](${alert.html_url})`,
                ``,
                `**Auto-generated by CodeQL workflow. Fix before merging to main.**`,
              ].join('\n');

              // Deduplicate — don't open if issue with same title exists
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'security,codeql',
              });
              if (!existing.data.some(i => i.title === title)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['security', 'codeql', 'auto-generated'],
                });
              }
            }
        env:
          ALERTS_JSON: ${{ steps.alerts.outputs.data }}
