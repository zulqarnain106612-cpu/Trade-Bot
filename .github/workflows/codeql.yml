# Registry: GOV-014, GOV-015 (config/quality_registry.json).
name: "CodeQL"

on:
  # The merge queue builds a temporary ref containing this pull request on top
  # of main and every entry queued ahead of it, and runs the required checks
  # against that. Without this trigger those checks never report on the queue
  # ref, the entry waits for a result that cannot arrive, and the queue jams
  # permanently -- which is worse than having no queue at all.
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    # `ready_for_review` is not one of the default activity types. Without it
    # the queue reveals a parked entry and no run starts: the promotion is
    # real, the checks never report, and the entry sits at the front of the
    # line forever. tests/test_pr_queue.py asserts every gating workflow
    # lists it (REG-0006).
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "27 4 * * 1"

# Required for uploading results / creating code scanning alerts
permissions:
  # The CodeQL action reads the workflow run it is part of
  # (GET /repos/{owner}/{repo}/actions/runs/{run_id}). Without `actions: read`
  # that call comes back "Resource not accessible by integration" and the
  # analysis step fails, which is how both language matrix legs died on #353.
  # Required on a private repository, recommended everywhere.
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (language=${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per run. 'javascript-typescript' covers JS and TS.
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No `fetch-depth: 0`. CodeQL extracts the checked-out tree; it does
        # not read history. A full clone is latency this analysis never
        # spends. The action's docs ask for one only for `--diff-range`
        # PR-only analysis, which this workflow deliberately does not use --
        # it analyses the whole tree every run.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Both languages here are interpreted: CodeQL builds their databases
          # by reading source, never by watching a compiler. `none` is the
          # supported way to say so, and it is what removes the four steps
          # that used to sit between init and analyse.
          #
          # Those steps cost 144s of the python job's 292s installing
          # requirements.txt so that "extractors can see dependencies", which
          # the Python extractor does not do -- it resolves imports against
          # the source tree and its own bundled library models, and an
          # installed site-packages changes nothing it reports. The Node half
          # was worse: `npm ci || npm install --legacy-peer-deps || true`
          # redid what ci.yml's frontend job already does and swallowed its
          # own failure, so it could only cost time or lie.
          #
          # The autobuild fallback goes with them. Under build-mode: none
          # there is nothing to fall back to, and a step documented as "a safe
          # no-op" is how a real build failure becomes invisible.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          # A human-readable category shown in the Code Scanning UI
          category: "/language:${{ matrix.language }}"
          # Uploading SARIF on pull_request creates an extra neutral "CodeQL"
          # check run; keep PR checks strictly green-only and upload on push.
          upload: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

  # ---------------------------------------------------------------------
  # All-green gate.
  #
  # Branch protection requires checks by name, so a job that never runs --
  # skipped by an `if:`, or never reached because an earlier job failed --
  # satisfies a required check by being absent. This job depends on every
  # other job here and fails unless each one reported success, so "all
  # green" becomes a single check that cannot be satisfied by absence.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped
  # the moment any dependency fails, and a skipped gate blocks nothing.
  # ---------------------------------------------------------------------
  gate:
    name: CodeQL gate (all jobs green)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [analyze]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py
