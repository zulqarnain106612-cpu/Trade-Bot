name: Auto-Fix

# Automatically applies safe, deterministic fixes to every PR:
#   - ruff --fix  (style, imports, pyupgrade, bugbear fixable issues)
#   - ruff format (formatting)
#   - npm fix     (frontend prettier)
# Commits fixes back to the PR branch as "chore: auto-fix [skip ci]"
# Non-fixable issues are reported as PR annotations — not auto-fixed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    name: Auto-Fix (ruff + prettier)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: ruff fix
        run: ruff check src/ tests/ --fix || true

      - name: ruff format
        run: ruff format src/ tests/

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci + prettier fix
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npx prettier --write "src/**/*.{js,jsx,ts,tsx,css}" || true

      - name: Commit fixes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (
            git add src/ frontend/src/  # SEC-009: explicit path scope, not -A
            git commit -m "chore: auto-fix ruff + prettier [skip ci]"
            git push
          )
