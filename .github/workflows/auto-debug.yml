name: AI-Assisted Debug

# On CI failure: collect logs → Claude analysis → Vulner-Fix.md → auto-fix → commit
# Requires: ANTHROPIC_API_KEY secret in repository settings.

on:
  workflow_run:
    workflows: ["CI", "Security Audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to debug
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-debug:
    name: AI failure analysis + Vulner-Fix.md
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: |
      github.event.workflow_run.conclusion == 'failure' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: |
          pip install anthropic==0.25.0 ruff==0.15.21
          pip install -e ".[dev]" -r requirements-dev.txt || true

      - name: Collect CI failure logs
        run: |
          python - << 'EOF'
          import subprocess, json

          cmds = [
              (["python", "-m", "pytest", "tests/", "--tb=long", "-q"], "pytest"),
              (["ruff", "check", "src/", "tests/", "--output-format=concise"], "ruff"),
              (["python", "-m", "mypy", "src/", "--ignore-missing-imports"], "mypy"),
              (["python", "-m", "bandit", "-r", "src/", "-l", "-q"], "bandit"),
          ]
          results = {}
          for cmd, name in cmds:
              r = subprocess.run(cmd, capture_output=True, text=True)
              results[name] = {"returncode": r.returncode, "stdout": r.stdout[-3000:], "stderr": r.stderr[-500:]}

          failures = {k: v for k, v in results.items() if v["returncode"] != 0}
          with open("ci_failures.json", "w") as f:
              json.dump(failures, f, indent=2)
          print("Failures:", list(failures.keys()))
          EOF

      - name: Claude analysis + Vulner-Fix.md update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/claude_debug_analysis.py

      - name: Apply ruff auto-fixes
        run: |
          ruff check src/ tests/ --fix --unsafe-fixes || true
          ruff format src/ tests/ || true

      - name: Commit all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (
            git commit -m "chore: auto-fix + Vulner-Fix.md update [skip ci]"
            git push || true
          )

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-debug-${{ github.run_id }}
          path: |
            ai_analysis.md
            ci_failures.json
          retention-days: 14
