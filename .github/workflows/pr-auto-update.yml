name: PR auto-update

# `main` is protected by a ruleset that requires an up-to-date branch, so every
# merge leaves every other open pull request one commit behind and waiting for
# somebody to click "Update branch". That click is the only manual step left in
# the merge path, and it is the reason a pull request that is otherwise green
# sits for hours.
#
# This does the click. It is not a queue: nothing is parked, nothing is drafted,
# every pull request keeps running its own checks whenever it likes. All that
# happens here is that when main moves, exactly one pull request -- the oldest
# open one that is actually behind -- is brought up to date.
#
# One, not all. Updating every branch at once would start N full CI runs for a
# main that is about to move again when the next one merges, and N-1 of those
# runs would be answering a stale question. The chain continues on its own:
# the updated pull request goes green, auto-merge merges it, that push to main
# fires this workflow again, and the next one is updated.

on:
  push:
    branches: [main]
  # For the case where the chain stalls -- a merge that happened while this
  # workflow was disabled, say -- and somebody wants to restart it by hand.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Serial by construction. Two of these running together would both pick "the
  # oldest behind pull request" and both update it.
  group: pr-auto-update
  cancel-in-progress: false

jobs:
  update-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bring the next out-of-date pull request up to date
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # NOT the default GITHUB_TOKEN. Updating a branch pushes a merge
          # commit to the pull request's head, and a push made with
          # GITHUB_TOKEN does not start a workflow run. The pull request would
          # come up to date and then sit with the check runs of its *previous*
          # head -- up to date, green-looking, and unmergeable forever. This is
          # the same trap the old queue's promotion step fell into.
          #
          # So a PAT (or GitHub App token) with `repo` scope is required. If
          # the secret is absent the job fails loudly rather than performing
          # the half of the operation that makes things worse.
          github-token: ${{ secrets.PR_AUTOUPDATE_TOKEN }}
          script: |
            if (!process.env.HAS_TOKEN) {
              core.setFailed(
                'PR_AUTOUPDATE_TOKEN is not set. A branch update pushed with ' +
                'GITHUB_TOKEN starts no workflow run, which would leave the ' +
                'pull request up to date with stale checks and permanently ' +
                'unmergeable. Add a PAT with repo scope as PR_AUTOUPDATE_TOKEN, ' +
                'or enable the merge queue instead -- every gating workflow ' +
                'already declares merge_group.');
              return;
            }

            // Oldest first: "the next one" means the one that has been waiting
            // longest, not whichever the API happens to return first.
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              base: context.payload.repository?.default_branch || 'main',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            // `mergeable_state` is computed asynchronously; a PR listed right
            // after a push often reports `unknown` on the first read. Ask
            // again rather than mistaking "not computed yet" for "up to date".
            async function state(number) {
              for (let attempt = 0; attempt < 3; attempt++) {
                const { data } = await github.rest.pulls.get({
                  ...context.repo, pull_number: number,
                });
                if (data.mergeable_state !== 'unknown') return data;
                await new Promise(r => setTimeout(r, 3000));
              }
              return null;
            }

            for (const pr of prs) {
              if (pr.draft) continue;              // a human said not yet
              const data = await state(pr.number);
              if (!data) {
                core.info(`#${pr.number}: mergeability still unknown, skipping`);
                continue;
              }
              // `behind` is the only state this can fix. `dirty` is a real
              // conflict and needs a person; `blocked` and `unstable` mean the
              // checks have something to say, not that the branch is stale.
              if (data.mergeable_state !== 'behind') {
                core.info(`#${pr.number}: ${data.mergeable_state}, nothing to update`);
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  ...context.repo, pull_number: pr.number,
                });
                core.notice(`Updated #${pr.number} onto ${context.payload.repository.default_branch}.`);
              } catch (e) {
                // 422 means GitHub decided it was not behind after all, which
                // is a race with another merge, not a failure worth going red
                // over -- the next push to main picks it up.
                if (e.status === 422) {
                  core.info(`#${pr.number}: no longer behind (${e.message})`);
                  continue;
                }
                throw e;
              }
              // Exactly one per merge. The next one is this pull request's
              // problem, once it merges and fires this workflow again.
              return;
            }

            core.info('No open pull request is behind. Nothing to do.');
        env:
          HAS_TOKEN: ${{ secrets.PR_AUTOUPDATE_TOKEN != '' && '1' || '' }}

# No `gate` job. The gate law covers workflows that run on `pull_request`,
# where a missing required check silently satisfies branch protection. This one
# runs on `push` to main and is never a required check.
