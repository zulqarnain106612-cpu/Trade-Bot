name: Frontend lockfile refresh

# frontend/package-lock.json can end up in a state npm will install from but
# will not audit. That is what happened on 2026-09-04: six entries under
# node_modules/@tailwindcss/oxide-wasm32-wasi/node_modules/ carried neither
# `resolved` nor `integrity`, so `npm ci` and `npm run build` both passed
# while the audit endpoint rejected the tree with
# 400 "Invalid package tree, run npm install to rebuild your package-lock.json"
# -- the CVE scan had silently stopped scanning anything.
#
# Regenerating the lockfile needs a network install, which is why it lives
# here rather than in a contributor's checkout. The job never pushes to a
# branch anyone builds from: it opens a pull request, so the refreshed
# lockfile goes through CI and review like any other change.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the lockfile is being refreshed (goes in the PR body)"
        type: string
        required: false
        default: "Scheduled refresh"

concurrency:
  # Two runs would open two PRs against the same file and conflict.
  group: frontend-lockfile-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Record the current audit verdict
        id: before
        working-directory: frontend
        # Non-blocking: the whole point is that this may be the broken state.
        run: |
          set +e
          npm audit --audit-level=high > before.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat before.log

      - name: Rebuild the lockfile
        working-directory: frontend
        # --package-lock-only touches no node_modules: it resolves the tree
        # and writes the lockfile, which is the only artifact wanted here.
        run: npm install --package-lock-only

      - name: Every entry must carry resolved + integrity
        working-directory: frontend
        # The defect this workflow exists for is exactly a missing pair of
        # these fields, so assert on them directly rather than trusting that
        # the reinstall fixed it.
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages)
              .filter(([name, meta]) => name && !meta.link && (!meta.resolved || !meta.integrity))
              .map(([name]) => name);
            if (bad.length) {
              console.error("::error::entries without resolved/integrity:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log(`all ${Object.keys(lock.packages).length} lockfile entries carry resolved + integrity`);
          '

      - name: The refreshed tree must actually audit
        working-directory: frontend
        # End-to-end proof, not a guess: the endpoint that rejected the old
        # tree has to accept this one. A high/critical advisory is a real
        # finding and is reported as such -- it does not invalidate the
        # refresh, so the PR is still opened below with the log attached.
        id: after
        run: |
          set +e
          npm audit --audit-level=high > after.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat after.log
          if grep -q "Invalid package tree" after.log; then
            echo "::error::the refreshed lockfile is still not auditable."
            exit 1
          fi

      - name: Install from the refreshed lockfile
        working-directory: frontend
        # `npm ci` fails outright if the lockfile disagrees with
        # package.json, so this is what proves the refresh did not trade an
        # unauditable tree for an uninstallable one.
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
          BEFORE: ${{ steps.before.outputs.status }}
          AFTER: ${{ steps.after.outputs.status }}
        # Done with git and gh rather than a create-pull-request action: a
        # third-party action here would have to be pinned to a commit hash to
        # satisfy CodeQL, and this needs about fifteen lines of shell anyway.
        #
        # The inputs above are passed as env vars, not interpolated into the
        # script body -- `${{ inputs.reason }}` is attacker-controlled text
        # and expanding it inside `run:` would be a shell injection.
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already correct -- nothing to open a PR for."
            exit 0
          fi

          BRANCH="chore/frontend-lockfile-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): regenerate package-lock.json so npm audit can read it"
          git push --force-with-lease origin "$BRANCH"

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Opened by [Frontend lockfile refresh](${RUN_URL})."
            echo
            echo "**Reason:** ${REASON}"
            echo
            echo "\`npm audit\` exit status before the refresh: \`${BEFORE}\`"
            echo "\`npm audit\` exit status after the refresh: \`${AFTER}\`"
            echo
            echo "The run verified, in this order, that the regenerated lockfile:"
            echo
            echo "1. carries \`resolved\` and \`integrity\` on every non-link entry;"
            echo "2. is accepted by the npm audit endpoint (no \`Invalid package tree\`);"
            echo "3. installs cleanly with \`npm ci\`;"
            echo "4. builds."
            echo
            echo "A non-zero *after* status with no \`Invalid package tree\` in the log"
            echo "means the scan ran and found high or critical advisories -- a real"
            echo "result that this refresh made visible again, not a failure of it."
          } > pr-body.md

          # A PR from a previous run may still be open against this branch;
          # the force-push above already updated it.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore(frontend): regenerate package-lock.json so npm audit can read it" \
              --body-file pr-body.md
          fi
