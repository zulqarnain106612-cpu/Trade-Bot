# Regenerated after the config purge (#144). Tool configuration only -- the
# dependency lists live in requirements*.txt, which CI installs directly.

[project]
name = "trade-bot"
version = "1.0.0"
description = "Async algorithmic crypto trading bot with an intelligence layer"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }
optional-dependencies.extras = { file = ["requirements-optional.txt"] }

[tool.setuptools.packages.find]
include = ["src*", "kg*", "rag_mongo*", "orchestrator*", "common*", "tools*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Tests import as `from src.<pkg> ...`, so the repo root must be importable.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", "crypto-predictor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
