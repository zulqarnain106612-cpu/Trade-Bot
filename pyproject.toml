[project]
name = "trade-bot"
version = "0.1.0"
description = "Async algorithmic trading bot — XGBoost + HMM + FastAPI"
requires-python = ">=3.11"  # CI and local dev both validated on 3.11 (Debt-003/Debt-008 resolved 2026-07-10)

# ─────────────────────────────────────────────────────────────────────────────
# RUFF — single source of truth for lint + format (replaces black/flake8/isort)
# All other formatters are disabled in VSCode settings.json
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version  = "py311"
line-length     = 100
indent-width    = 4
src             = ["src", "tests"]
# .claude carries skill-vendored tooling (crypto-architect's validate_arch.py),
# versioned with the skill rather than linted as project source.
exclude         = [".venv", "frontend", "__pycache__", "dist", ".git", ".project-intel", ".claude"]

[tool.ruff.lint]
select = [
    "E",    "W",    # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "UP",           # pyupgrade
    "RUF",          # ruff-specific rules
    "SIM",          # flake8-simplify
    "PIE",          # flake8-pie
    "TID",          # flake8-tidy-imports
    "PGH",          # pygrep-hooks
    "FLY",          # flynt
    "PERF",         # perflint
    "ASYNC",        # flake8-async (blocks time.sleep in async, etc.)
]
ignore = [
    "E501",    # line-too-long — formatter handles it
    "B008",    # function call in default arg
    "B904",    # raise from inside except
    "B006",    # mutable default arg
    "SIM108",  # ternary operator
    "SIM117",  # nested with
    "RUF012",  # mutable class attrs (dataclass false-positives)
    "PERF203", # try-except in loop (our retry logic)
    "PGH003",  # type: ignore without code (ccxt)
]
fixable   = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party    = ["src"]
force-single-line    = false
lines-after-imports  = 2
combine-as-imports   = true

[tool.ruff.lint.per-file-ignores]
"tests/*"          = ["S101", "PLR2004", "ANN"]
"src/api/main.py"  = ["B008"]

[tool.ruff.format]
# SINGLE authoritative format config — VSCode defaultFormatter = charliermarsh.ruff
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "auto"
docstring-code-format     = true

# ─────────────────────────────────────────────────────────────────────────────
# MYPY
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version        = "3.11"
ignore_missing_imports = true
no_strict_optional    = false
warn_return_any       = false
warn_unused_configs   = true
warn_redundant_casts  = true
warn_unused_ignores   = false
exclude               = ["frontend/", ".venv/", "dist/", "\\.claude/"]

# ─────────────────────────────────────────────────────────────────────────────
# PYTEST
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["tests"]
pythonpath    = ["."]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts       = "-v --tb=short -q --cov=src --cov-report=term-missing --cov-fail-under=95"
# A hung test otherwise consumes the entire CI job and reports nothing: the
# step never finishes and the log ends mid-suite with no indication of which
# test is stuck. faulthandler is built into pytest (no plugin needed) and
# dumps every thread's stack once a single test exceeds this, naming the
# culprit and the line it is blocked on. 300s is well above the slowest real
# test here (the XGBoost CPCV retrains) and well below the job timeout.
faulthandler_timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# COVERAGE
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["src"]
omit     = ["*/__init__.py", "*/migrations/*", ".venv/*"]
branch   = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
# Global gate — does NOT protect individual high-blast-radius files.
# Per-file floors are enforced by scripts/check_coverage_floors.py (GAP-020).
# Run after pytest: python3 scripts/check_coverage_floors.py
# Floors: src/execution/ ≥75%, src/engine/ ≥60%, runtime_monitor ≥50%
fail_under     = 95
exclude_lines  = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ─────────────────────────────────────────────────────────────────────────────
# BANDIT
# ─────────────────────────────────────────────────────────────────────────────
[tool.bandit]
targets   = ["src"]
severity  = "medium"
confidence = "medium"
skips     = ["B101", "B311"]   # assert, random (tests + non-crypto use)

# ─────────────────────────────────────────────────────────────────────────────
# PYRIGHT  (Pylance backend — mirrors Pylance VSCode settings)
# ─────────────────────────────────────────────────────────────────────────────
[tool.pyright]
include                 = ["src", "tests"]
exclude                 = [".venv", "frontend", "dist"]
pythonVersion           = "3.11"
typeCheckingMode        = "basic"
useLibraryCodeForTypes  = true
reportMissingImports    = "none"
reportMissingModuleSource = "none"
reportUnusedCoroutine   = "error"
reportPossiblyUnbound   = "warning"
