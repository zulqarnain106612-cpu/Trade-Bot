---
# Settings consumed by CryptoIntelligence and its bounded horizon workers.
# Horizon IDs, targets, and architecture declarations live in horizons.yaml.
n_workers: 4
inference_timeout_seconds: 1.0
max_prediction_age_seconds: 20.0
ecc_enabled: true
ecc_interval_seconds: 60.0
btc_node_rpc:
  url: "http://127.0.0.1:8332"
checkpoint_dir: "./models/horizons"
duckdb_path: "./data/crypto_intel.duckdb"

risk:
  kelly_fraction: 0.5
  conf_threshold: 0.65
  sharpe_min: 1.0
  drawdown_floor: 0.10
  max_daily_loss: 0.02
  cvar_max_pct: 0.02
  horizon_size_decay: 0.1

observability:
  mlflow_uri: "http://127.0.0.1:5000"
