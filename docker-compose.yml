# GAP-006: local TimescaleDB for bars/trades/equity storage.
# Free community image, runs entirely on this machine — no cloud, no cost.
#
# Works with either engine:
#   docker compose up -d        (requires docker group membership)
#   podman compose up -d        (rootless, no privileges needed)
# Or use the helper: bash scripts/timescaledb.sh up
#
# Credentials are local-dev defaults; the container binds to 127.0.0.1 only,
# so it is unreachable from the network. Override via STORAGE_TIMESCALE_DSN
# in .env if you change them.
services:
  timescaledb:
    image: docker.io/timescale/timescaledb:2.17.2-pg17
    container_name: tradebot-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: tradebot-local  # pragma: allowlist secret — localhost-only dev credential
      POSTGRES_DB: tradebot
      # Timescale tuning for an 11GB-RAM host sharing with the bot itself
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: "2"
    volumes:
      - tradebot-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebot -d tradebot"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── crypto-intel-v6 services ───────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: crypto_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: crypto_neo4j
    environment:
      NEO4J_AUTH: "neo4j/crypto"  # pragma: allowlist secret — localhost-only dev credential
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: "512M"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: crypto_mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlruns
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    container_name: crypto_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "crypto"  # pragma: allowlist secret — localhost-only dev credential
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tradebot-timescale-data:
  neo4j_data:
  mlflow_data:
  grafana_data:
